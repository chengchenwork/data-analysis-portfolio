<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合成经营示例 五家 T2 横向对比</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-soft: #fbfcfd;
      --text: #111827;
      --muted: #667085;
      --faint: #98a2b3;
      --border: #e4e7ec;
      --line: #eef0f3;
      --blue: #2563eb;
      --green: #16a34a;
      --amber: #f59e0b;
      --red: #dc2626;
      --teal: #0891b2;
      --ink: #0f172a;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.45;
      letter-spacing: 0;
    }

    button, select, input { font: inherit; }
    button { color: inherit; }

    .shell {
      width: min(1240px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 16px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.1;
      font-weight: 750;
      letter-spacing: 0;
    }

    .total-chip {
      min-width: 270px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: grid;
      gap: 4px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.04);
    }

    .total-chip span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .total-chip strong {
      font-size: 25px;
      line-height: 1.1;
      font-weight: 760;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 8px 26px rgba(15, 23, 42, 0.035);
      margin-top: 16px;
      overflow: hidden;
    }

    .panel-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .panel-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 740;
    }

    .panel-body { padding: 18px 20px 20px; }

    .toolbar {
      padding: 14px 16px;
      display: block;
    }

    .control-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
      margin-bottom: 8px;
    }

    .store-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .store-toggle {
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 10px 5px 8px;
      display: inline-flex;
      gap: 7px;
      align-items: center;
      background: var(--surface-soft);
      color: var(--text);
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      user-select: none;
    }

    .store-toggle input { accent-color: var(--blue); }
    .swatch {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      flex: 0 0 auto;
    }

    .segmented {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .segmented button,
    .legend-button,
    .legend-action {
      min-height: 34px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      border-radius: 999px;
      padding: 6px 11px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 680;
      transition: border-color .16s ease, background .16s ease, color .16s ease;
    }

    .segmented button.active,
    .legend-button.active,
    .legend-action.active {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }

    .legend-button.muted {
      opacity: .38;
      text-decoration: line-through;
    }

    .legend-action {
      min-height: 30px;
      padding: 5px 10px;
    }

    .expense-tools {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
    }

    .expense-solo-field {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
    }

    .expense-solo-select {
      min-width: 190px;
    }

    .chart-area {
      display: block;
    }

    .bar-list {
      display: grid;
      gap: 10px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) 128px;
      gap: 14px;
      align-items: center;
      border: 0;
      background: transparent;
      width: 100%;
      padding: 5px 0;
      text-align: left;
      cursor: pointer;
    }

    .bar-row.is-active .bar-label { color: var(--ink); font-weight: 780; }
    .bar-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 680;
      white-space: nowrap;
    }

    .bar-value {
      font-variant-numeric: tabular-nums;
      text-align: right;
      font-size: 13px;
      font-weight: 720;
    }

    .bar-track {
      height: 28px;
      background: #f0f2f5;
      border: 1px solid #e8ebef;
      border-radius: 999px;
      position: relative;
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      left: var(--left);
      width: max(var(--width), 2px);
      top: 4px;
      bottom: 4px;
      border-radius: 999px;
      background: var(--color);
      min-width: 2px;
    }

    .zero-line {
      position: absolute;
      left: var(--zero);
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(15, 23, 42, .22);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      align-items: stretch;
    }

    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      min-width: 980px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 11px 10px;
      text-align: right;
      vertical-align: middle;
      white-space: nowrap;
    }

    th:first-child, td:first-child { text-align: left; }
    th {
      background: #f8fafc;
      color: #344054;
      font-size: 12px;
      font-weight: 760;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    th button {
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      color: inherit;
      font-weight: inherit;
    }

    tbody tr { cursor: pointer; }
    tbody tr:hover td { background: #fafafa; }
    tbody tr.is-active td {
      background: #f2f6ff;
      font-weight: 720;
    }

    .pos { color: var(--green); }
    .neg { color: var(--red); }
    .muted { color: var(--muted); }

    .heatmap {
      display: grid;
      grid-template-columns: 86px repeat(5, minmax(96px, 1fr));
      gap: 7px;
      min-width: 680px;
    }

    .heat-head,
    .heat-store,
    .heat-cell {
      border-radius: var(--radius);
      min-height: 58px;
      display: grid;
      align-content: center;
      padding: 8px 9px;
      border: 1px solid transparent;
    }

    .heat-head {
      color: var(--muted);
      font-size: 12px;
      font-weight: 780;
      min-height: 38px;
      background: #f8fafc;
      text-align: center;
    }

    .heat-store {
      background: #f8fafc;
      color: var(--text);
      font-weight: 780;
      font-size: 13px;
      cursor: pointer;
      border-color: var(--border);
    }

    .heat-cell {
      font-size: 13px;
      text-align: center;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
      color: #1f2937;
      cursor: pointer;
      border-color: rgba(255,255,255,.45);
    }

    .heat-cell small {
      color: rgba(31, 41, 55, .66);
      font-size: 11px;
      font-weight: 640;
      margin-top: 2px;
    }

    .chart-svg {
      width: 100%;
      min-height: 330px;
      display: block;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .point { cursor: pointer; }
    .point text {
      font-size: 12px;
      fill: #344054;
      font-weight: 720;
    }

    .scatter-legend {
      margin: 0 0 10px;
    }

    .expense-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .stack-list,
    .activity-list {
      display: grid;
      gap: 12px;
    }

    .stack-row,
    .activity-row {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr) 120px;
      gap: 12px;
      align-items: center;
      cursor: pointer;
    }

    .stack-track {
      height: 30px;
      background: #f0f2f5;
      border: 1px solid #e8ebef;
      border-radius: 999px;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .stack-seg {
      height: 100%;
      min-width: 1px;
      background: var(--color);
      cursor: crosshair;
      transition: filter .14s ease, opacity .14s ease;
    }

    .stack-seg:hover,
    .stack-seg:focus-visible {
      filter: brightness(.88) saturate(1.12);
      opacity: .92;
      outline: 2px solid rgba(17, 24, 39, .18);
      outline-offset: -2px;
    }

    .stack-percent {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
      border: 1px solid rgba(15, 23, 42, .12);
      border-radius: 999px;
      background: rgba(255, 255, 255, .88);
      color: var(--ink);
      padding: 1px 7px;
      font-size: 12px;
      font-weight: 780;
      font-variant-numeric: tabular-nums;
      line-height: 1.35;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .08);
    }

    .chart-tooltip {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 30;
      width: max-content;
      max-width: min(300px, calc(100vw - 24px));
      pointer-events: none;
      opacity: 0;
      transform: translate3d(-9999px, -9999px, 0);
      transition: opacity .12s ease;
      background: rgba(15, 23, 42, .96);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: var(--radius);
      padding: 10px 12px;
      box-shadow: 0 14px 34px rgba(15, 23, 42, .24);
      font-size: 12px;
      line-height: 1.35;
    }

    .chart-tooltip.is-visible {
      opacity: 1;
    }

    .tooltip-title {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 760;
      white-space: nowrap;
    }

    .tooltip-title span {
      color: rgba(255, 255, 255, .68);
      font-weight: 700;
    }

    .tooltip-grid {
      display: grid;
      grid-template-columns: auto auto;
      gap: 5px 18px;
      align-items: baseline;
      font-variant-numeric: tabular-nums;
    }

    .tooltip-grid span {
      color: rgba(255, 255, 255, .66);
    }

    .tooltip-grid strong {
      justify-self: end;
      font-weight: 760;
    }

    .activity-track {
      height: 28px;
      background: #f0f2f5;
      border: 1px solid #e8ebef;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .activity-fill {
      position: absolute;
      left: 0;
      top: 4px;
      bottom: 4px;
      border-radius: 999px;
      width: var(--width);
      background: var(--color);
    }

    .metric-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .metric-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #ffffff;
      padding: 4px 10px;
      white-space: nowrap;
    }

    .metric-chip b {
      color: var(--ink);
      font-weight: 780;
    }

    .activity-layout {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(0, 560px);
      gap: 16px;
      align-items: stretch;
    }

    .activity-compare {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .traffic-sales-layout {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(0, 560px);
      gap: 16px;
      align-items: start;
    }

    .activity-summary,
    .traffic-summary {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-soft);
      padding: 12px;
      display: grid;
      gap: 10px;
      height: 100%;
    }

    .activity-summary-head,
    .traffic-summary-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
    }

    .traffic-row {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr) 132px;
      gap: 10px;
      align-items: center;
      cursor: pointer;
    }

    .traffic-track {
      height: 24px;
      border: 1px solid #e8ebef;
      border-radius: 999px;
      background: #f0f2f5;
      overflow: hidden;
      position: relative;
    }

    .traffic-fill {
      position: absolute;
      left: 0;
      top: 4px;
      bottom: 4px;
      width: var(--width);
      border-radius: 999px;
      background: var(--color);
    }

    .traffic-value {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .traffic-value strong,
    .traffic-value span {
      display: block;
    }

    .traffic-value strong {
      color: var(--text);
      font-size: 13px;
      line-height: 1.2;
    }

    .traffic-value span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
      margin-top: 2px;
    }

    .subsection-title {
      margin: 0 0 12px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.2;
      font-weight: 760;
    }

    .activity-matrix {
      width: 100%;
      height: 100%;
      min-width: 0;
      table-layout: fixed;
    }

    .activity-matrix-wrap {
      width: min(100%, 560px);
      justify-self: start;
      height: 100%;
    }

    .activity-matrix th,
    .activity-matrix td {
      padding: 7px 5px;
      white-space: normal;
    }

    .activity-matrix th {
      text-align: center;
    }

    .activity-matrix th:first-child {
      text-align: left;
      width: 64px;
    }

    .activity-matrix td:first-child {
      font-weight: 780;
      padding-right: 12px;
    }

    .activity-cell {
      text-align: center;
      border-left: 2px solid var(--store-color);
      background: linear-gradient(90deg, color-mix(in srgb, var(--store-color) 7%, transparent), transparent 70%);
    }

    .activity-cell strong {
      display: block;
      color: var(--text);
      font-size: 13px;
      line-height: 1.25;
      font-weight: 780;
    }

    .activity-cell span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .select {
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 0 10px;
      color: var(--text);
      font-weight: 650;
    }

    .conclusion-panel {
      border-color: #dbe3f0;
    }

    .conclusion-panel .panel-body {
      padding-top: 14px;
    }

    .insights {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .store-insights {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .insight,
    .store-insight {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      min-width: 0;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    .insight {
      min-height: 94px;
    }

    .store-insight {
      min-height: 150px;
      border-top: 3px solid var(--border);
    }

    .insight h3,
    .store-insight h3 {
      margin: 0 0 7px;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.25;
      font-weight: 760;
    }

    .store-insight h3 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .store-insight-name {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .store-status {
      color: var(--muted);
      font-size: 11px;
      font-weight: 720;
      white-space: nowrap;
    }

    .insight p,
    .store-insight p {
      margin: 0;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.45;
    }

    .store-insight p + p {
      margin-top: 5px;
    }

    .insight strong {
      color: var(--ink);
      font-weight: 780;
    }

    .store-mini-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin: 8px 0 10px;
    }

    .store-mini-grid span {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      padding: 6px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.15;
    }

    .store-mini-grid b {
      display: block;
      margin-top: 2px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 780;
    }

    .store-section-title {
      margin-top: 16px;
      margin-bottom: 10px;
    }

    @media (max-width: 980px) {
      .topbar,
      .toolbar,
      .activity-layout,
      .traffic-sales-layout,
      .grid-2,
      .insights,
      .store-insights {
        grid-template-columns: 1fr;
      }
      .total-chip { min-width: 0; }
      .bar-row,
      .stack-row,
      .activity-row,
      .traffic-row {
        grid-template-columns: 68px minmax(0, 1fr) 96px;
      }
    }

    @media (max-width: 640px) {
      .shell { width: min(100vw - 20px, 1240px); padding-top: 18px; }
      .panel-head, .panel-body { padding-left: 14px; padding-right: 14px; }
      .toolbar { padding: 12px; }
      .bar-row,
      .stack-row,
      .activity-row,
      .traffic-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .bar-value { text-align: left; }
      .heatmap { grid-template-columns: 80px repeat(5, 92px); }
    }
  </style>

<body><aside class="portfolio-banner"><a href="../budget.html">← 返回项目说明</a><span><b>合成数据演示</b> · 名称、金额、指标及费率均为独立构造的示例，不反映实际业务。</span></aside>
<main class="shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">DEALER PERFORMANCE · SYNTHETIC</p>
      <h1>五家 T2 横向对比</h1>
    </div>
    <div class="total-chip">
      <span>五家合计确收</span>
      <strong id="portfolioRevenue">-</strong>
      <span id="portfolioProfit">-</span>
    </div>
  </header>

  <section class="panel toolbar">
    <div>
      <div class="control-label">店铺</div>
      <div class="store-filters" id="storeFilters"></div>
    </div>
  </section>

  <section class="panel conclusion-panel">
    <div class="panel-head">
      <div>
        <h2 class="panel-title">横向结论</h2>
      </div>
    </div>

function fmtWan(value) {
  return `${(value / 10000).toLocaleString("zh-CN", { minimumFractionDigits: 1, maximumFractionDigits: 1 })}万`;
}

function fmtPct(value) {
  return `${(value * 100).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%`;
}

function fmtPct1(value) {
  return `${(value * 100).toLocaleString("zh-CN", { minimumFractionDigits: 1, maximumFractionDigits: 1 })}%`;
}

function fmtInt(value) {
  return Math.round(value).toLocaleString("zh-CN");
}

function fmtYuan(value) {
  return `¥${Math.round(value).toLocaleString("zh-CN")}`;
}

function fmtRoi(value) {
  return value ? `1:${Math.round(value).toLocaleString("zh-CN")}` : "-";
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function tooltipMarkup(scope, label, rows) {
  return `<div class="tooltip-title"><span>${escapeHtml(scope)}</span><b>${escapeHtml(label)}</b></div>
    <div class="tooltip-grid">
      ${rows.map(([name, value]) => `<span>${escapeHtml(name)}</span><strong>${value}</strong>`).join("")}
    </div>`;
}

function moveTooltip(event) {
  const tooltip = document.getElementById("chartTooltip");
  if (!tooltip || !tooltip.classList) return;
  const pad = 14;
  const offset = 16;
  const width = tooltip.offsetWidth || 260;
  const height = tooltip.offsetHeight || 120;
  const viewportWidth = window.innerWidth || 1280;
  const viewportHeight = window.innerHeight || 720;
  let x = (event.clientX || 0) + offset;
  let y = (event.clientY || 0) + offset;
  if (x + width + pad > viewportWidth) x = (event.clientX || 0) - width - offset;
  if (y + height + pad > viewportHeight) y = (event.clientY || 0) - height - offset;
  tooltip.style.transform = `translate3d(${Math.max(pad, x)}px, ${Math.max(pad, y)}px, 0)`;
}

function showTooltip(event, html) {
  const tooltip = document.getElementById("chartTooltip");
  if (!tooltip || !tooltip.classList) return;
  tooltip.innerHTML = html;
  tooltip.classList.add("is-visible");
  moveTooltip(event);
}

function hideTooltip() {
  const tooltip = document.getElementById("chartTooltip");
  if (!tooltip || !tooltip.classList) return;
  tooltip.classList.remove("is-visible");
  tooltip.style.transform = "translate3d(-9999px, -9999px, 0)";
}

function metricValue(store, key) {
  if (key === "total_act_cost") return store.summary.total_act_cost;
  if (key === "total_traffic_cost") return store.summary.total_traffic_cost;
  return metricDefs[key]?.get(store) ?? store.summary[key] ?? 0;
}

function formatSummaryValue(store, key) {
  if (key === "store") return store.store;
  if (key === "total_revenue" || key === "total_net_profit" || key === "total_act_cost" || key === "total_traffic_cost") return fmtWan(metricValue(store, key));
  if (key === "total_expense_rate" || key === "overall_net_profit_rate" || key === "total_act_rate" || key === "overall_conversion_rate") return fmtPct(metricValue(store, key));
  if (key === "total_volume") return fmtInt(metricValue(store, key));
  if (key === "asp") return fmtYuan(metricValue(store, key));
  if (key === "overall_traffic_roi") return fmtRoi(metricValue(store, key));
  return metricValue(store, key).toLocaleString("zh-CN");
}

function visibleStores() {
  return stores.filter(store => state.visible.has(store.store));
}

function byStore(name) {
  return stores.find(store => store.store === name) || stores[0];
}

function lobRow(store, lob) {
  return store.data.find(row => row.LOB === lob) || {};
}

function actRow(store, lob) {
  return store.actData.find(row => row.LOB === lob) || {};
}

function bestStore(key, pool = stores) {
  const def = metricDefs[key];
  const dir = def?.better === "low" ? 1 : -1;
  return [...pool].sort((a, b) => (metricValue(a, key) - metricValue(b, key)) * dir)[0];
}

function sortedVisibleByMetric(key = state.chartMetric) {
  const def = metricDefs[key] || { better: "high" };
  const defaultDir = def.better === "low" ? 1 : -1;
  return visibleStores().sort((a, b) => (metricValue(a, key) - metricValue(b, key)) * defaultDir);
}

function colorForValue(value, store) {
  if (state.chartMetric === "total_net_profit" || state.chartMetric === "overall_net_profit_rate") {
    return value >= 0 ? "var(--green)" : "var(--red)";
  }
  return store.color;
}

function initControls() {
  const storeFilters = document.getElementById("storeFilters");
  storeFilters.innerHTML = stores.map(store => `
    <label class="store-toggle">
      <input type="checkbox" value="${store.store}" checked>
      <span class="swatch" style="background:${store.color}"></span>${store.store}
    </label>`).join("");
  storeFilters.addEventListener("change", event => {
    const input = event.target;
    if (input.tagName !== "INPUT") return;
    const checked = [...storeFilters.querySelectorAll("input:checked")].map(i => i.value);
    if (!checked.length) {
      input.checked = true;
      return;
    }
    state.visible = new Set(checked);
    if (!state.visible.has(state.activeStore)) state.activeStore = checked[0];
    renderAll();
  });

  const metricSelector = document.getElementById("metricSelector");
  metricSelector.innerHTML = Object.entries(metricDefs).map(([key, def]) => `
    <button type="button" data-metric="${key}" class="${key === state.chartMetric ? "active" : ""}">${def.label}</button>`).join("");
  metricSelector.addEventListener("click", event => {
    const button = event.target.closest("button[data-metric]");
    if (!button) return;
    state.chartMetric = button.dataset.metric;
    state.sortKey = state.chartMetric;
    metricSelector.querySelectorAll("button").forEach(btn => btn.classList.toggle("active", btn === button));
    renderAll();
  });

  const heatMetric = document.getElementById("heatMetric");
  heatMetric.innerHTML = Object.entries(lobMetricDefs).map(([key, def]) => `<option value="${key}">${def.label}</option>`).join("");
  heatMetric.value = state.heatMetric;
  heatMetric.addEventListener("change", event => {
    state.heatMetric = event.target.value;
    renderHeatmap();
  });

  const activityMetric = document.getElementById("activityMetric");
  activityMetric.innerHTML = [
    `<option value="Total_Act_Cost">活动支出合计</option>`,
    ...activityOrder.map(label => `<option value="${label}">${label.replace("（商家贴息）-", "商家贴息")}</option>`)
  ].join("");
  activityMetric.addEventListener("change", event => {
    state.activityMetric = event.target.value;
    renderActivity();
  });
}

function renderPortfolio() {
  const revenue = stores.reduce((sum, store) => sum + store.summary.total_revenue, 0);
  const profit = stores.reduce((sum, store) => sum + store.summary.total_net_profit, 0);
  const ttl = stores.reduce((sum, store) => sum + store.summary.total_ttl_cost, 0);
  document.getElementById("portfolioRevenue").textContent = fmtWan(revenue);
  document.getElementById("portfolioProfit").textContent = `合计净利润 ${fmtWan(profit)} · TTL费用率 ${fmtPct(ttl / revenue)}`;
}

function renderBars() {
  const rows = sortedVisibleByMetric();
  const def = metricDefs[state.chartMetric];
  const values = rows.map(store => def.get(store));
  let min = Math.min(0, ...values);
  let max = Math.max(0, ...values);
  if (max === min) max = min + 1;
  const span = max - min;
  const zero = ((0 - min) / span) * 100;

  document.getElementById("barChart").innerHTML = rows.map(store => {
    const value = def.get(store);
    const pos = ((value - min) / span) * 100;
    const left = Math.min(zero, pos);
    const width = Math.abs(pos - zero);
    const color = colorForValue(value, store);
    return `<button type="button" class="bar-row ${store.store === state.activeStore ? "is-active" : ""}" data-store="${store.store}">
      <span class="bar-label">${store.store}</span>
      <span class="bar-track">
        <span class="zero-line" style="--zero:${zero}%"></span>
        <span class="bar-fill" style="--left:${left}%;--width:${width}%;--color:${color}"></span>
      </span>
      <span class="bar-value ${value < 0 ? "neg" : ""}">${def.format(value)}</span>
    </button>`;
  }).join("");

  document.getElementById("barChart").querySelectorAll(".bar-row").forEach(row => {
    row.addEventListener("click", () => {
      state.activeStore = row.dataset.store;
      renderActiveDependents();
    });
  });
}

function renderSummaryTable() {
  const head = document.getElementById("summaryHead");
  head.innerHTML = summaryColumns.map(([key, label]) => `
    <th><button type="button" data-sort="${key}">${label}${state.sortKey === key ? (state.sortDir === -1 ? " ↓" : " ↑") : ""}</button></th>`).join("");
  head.querySelectorAll("button[data-sort]").forEach(button => {
    button.addEventListener("click", () => {
      const key = button.dataset.sort;
      if (state.sortKey === key) state.sortDir *= -1;
      else {
        state.sortKey = key;
        state.sortDir = key === "total_expense_rate" || key === "total_act_rate" ? 1 : -1;
      }
      renderSummaryTable();
    });
  });

  const rows = visibleStores().sort((a, b) => {
    if (state.sortKey === "store") return a.store.localeCompare(b.store, "zh-CN") * state.sortDir;
    return (metricValue(a, state.sortKey) - metricValue(b, state.sortKey)) * state.sortDir;
  });

  document.getElementById("summaryBody").innerHTML = rows.map(store => `
    <tr data-store="${store.store}" class="${store.store === state.activeStore ? "is-active" : ""}">
      ${summaryColumns.map(([key]) => {
        const value = formatSummaryValue(store, key);
        const negative = ["total_net_profit", "overall_net_profit_rate"].includes(key) && metricValue(store, key) < 0;
        const positive = ["total_net_profit", "overall_net_profit_rate"].includes(key) && metricValue(store, key) >= 0;
        const cls = negative ? "neg" : positive ? "pos" : "";
        if (key === "store") {
          return `<td><span class="swatch" style="background:${store.color}"></span> ${value}</td>`;
        }
        return `<td class="${cls}">${value}</td>`;
      }).join("")}
    </tr>`).join("");

  document.getElementById("summaryBody").querySelectorAll("tr[data-store]").forEach(row => {
    row.addEventListener("click", () => {
      state.activeStore = row.dataset.store;
      renderActiveDependents();
    });
  });
}

function renderHeatmap() {
  const def = lobMetricDefs[state.heatMetric];
  const rows = visibleStores();
  const values = [];
  rows.forEach(store => {
    heatmapLobOrder.forEach(lob => {
      values.push(def.get(lobRow(store, lob), actRow(store, lob)) || 0);
    });
  });
  const maxAbs = Math.max(...values.map(v => Math.abs(v)), 1);
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const diverging = def.signed;

  const heatmap = document.getElementById("heatmap");
  let html = `<div class="heat-head"></div>${heatmapLobOrder.map(lob => `<div class="heat-head">${lob}</div>`).join("")}`;
  rows.forEach(store => {
    html += `<div class="heat-store" data-store="${store.store}"><span class="swatch" style="background:${store.color}"></span>${store.store}</div>`;
    heatmapLobOrder.forEach(lob => {
      const row = lobRow(store, lob);
      const act = actRow(store, lob);
      const value = def.get(row, act) || 0;
      const style = heatStyle(value, { diverging, maxAbs, max, min });
      html += `<div class="heat-cell" data-store="${store.store}" style="${style}">
        ${def.format(value)}
        <small>${fmtPct1(row.Revenue_Share || 0)}收入占比</small>
      </div>`;
    });
  });
  heatmap.innerHTML = html;
  heatmap.querySelectorAll("[data-store]").forEach(cell => {
    cell.addEventListener("click", () => {
      state.activeStore = cell.dataset.store;
      renderActiveDependents();
    });
  });
}

function heatStyle(value, scale) {
  if (scale.diverging) {
    const intensity = Math.min(Math.abs(value) / scale.maxAbs, 1);
    const alpha = 0.08 + intensity * 0.38;
    return value >= 0 ? `background:rgba(22,163,74,${alpha})` : `background:rgba(220,38,38,${alpha})`;
  }
  const intensity = scale.max === scale.min ? 0.25 : Math.min(Math.max((value - scale.min) / (scale.max - scale.min), 0), 1);
  const alpha = 0.08 + intensity * 0.35;
  return `background:rgba(37,99,235,${alpha})`;
}

function renderScatter() {
  const rows = visibleStores();
  const xs = rows.map(s => s.summary.total_expense_rate);
  const ys = rows.map(s => s.summary.overall_net_profit_rate);
  const rs = rows.map(s => s.summary.total_revenue);
  const minX = Math.min(...xs, 0.055);
  const maxX = Math.max(...xs, 0.12);
  const minY = Math.min(...ys, -0.075);
  const maxY = Math.max(...ys, 0.02);
  const minR = Math.min(...rs);
  const maxR = Math.max(...rs);
  const pad = { l: 62, r: 28, t: 24, b: 48 };
  const w = 620;
  const h = 360;
  const plotW = w - pad.l - pad.r;
  const plotH = h - pad.t - pad.b;
  const xMap = value => pad.l + ((value - minX) / (maxX - minX || 1)) * plotW;
  const yMap = value => pad.t + plotH - ((value - minY) / (maxY - minY || 1)) * plotH;
  const rMap = value => 8 + ((Math.sqrt(value) - Math.sqrt(minR)) / (Math.sqrt(maxR) - Math.sqrt(minR) || 1)) * 18;
  const zeroY = yMap(0);

  const grid = [0, .25, .5, .75, 1].map(t => {
    const x = pad.l + t * plotW;
    const y = pad.t + t * plotH;
    const xv = minX + t * (maxX - minX);
    const yv = maxY - t * (maxY - minY);
    return `<line x1="${x}" y1="${pad.t}" x2="${x}" y2="${pad.t + plotH}" stroke="#e5e7eb"/>
            <text x="${x}" y="${h - 18}" text-anchor="middle" fill="#667085" font-size="11">${fmtPct1(xv)}</text>
            <line x1="${pad.l}" y1="${y}" x2="${pad.l + plotW}" y2="${y}" stroke="#e5e7eb"/>
            <text x="${pad.l - 9}" y="${y + 4}" text-anchor="end" fill="#667085" font-size="11">${fmtPct1(yv)}</text>`;
  }).join("");

  const points = rows.map(store => {
    const x = xMap(store.summary.total_expense_rate);
    const y = yMap(store.summary.overall_net_profit_rate);
    const r = rMap(store.summary.total_revenue);
    const textY = y - r - 6 < 12 ? y + r + 16 : y - r - 6;
    return `<g class="point" data-store="${store.store}">
      <circle cx="${x}" cy="${y}" r="${r}" fill="${store.color}" fill-opacity=".78" stroke="#fff" stroke-width="2">
        <title>${store.store} · TTL ${fmtPct(store.summary.total_expense_rate)} · 净利率 ${fmtPct(store.summary.overall_net_profit_rate)}</title>
      </circle>
      <text x="${x}" y="${textY}" text-anchor="middle">${store.store}</text>
    </g>`;
  }).join("");

  const zeroLine = zeroY >= pad.t && zeroY <= pad.t + plotH
    ? `<line x1="${pad.l}" y1="${zeroY}" x2="${pad.l + plotW}" y2="${zeroY}" stroke="#111827" stroke-dasharray="4 4" opacity=".35"/>`
    : "";

  const svg = document.getElementById("scatter");
  svg.innerHTML = `
    <rect x="0" y="0" width="${w}" height="${h}" fill="transparent"/>
    ${grid}
    ${zeroLine}
    <line x1="${pad.l}" y1="${pad.t + plotH}" x2="${pad.l + plotW}" y2="${pad.t + plotH}" stroke="#98a2b3"/>
    <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t + plotH}" stroke="#98a2b3"/>
    <text x="${pad.l + plotW / 2}" y="${h - 4}" text-anchor="middle" fill="#344054" font-size="12" font-weight="700">TTL费用率</text>
    <text x="16" y="${pad.t + plotH / 2}" transform="rotate(-90 16 ${pad.t + plotH / 2})" text-anchor="middle" fill="#344054" font-size="12" font-weight="700">净利率</text>
    ${points}`;
  svg.querySelectorAll(".point").forEach(point => {
    point.addEventListener("click", () => {
      state.activeStore = point.dataset.store;
      renderActiveDependents();
    });
  });
}

function renderExpense() {
  hideTooltip();
  const activeExpenses = expenseOrder.filter(key => !state.hiddenExpenses.has(key));
  const singleExpense = activeExpenses.length === 1 ? activeExpenses[0] : null;
  const legend = document.getElementById("expenseLegend");
  legend.innerHTML = `
    <div class="expense-tools">
      <button type="button" class="legend-action ${state.hiddenExpenses.size ? "" : "active"}" data-expense-all="true">全部</button>
      <label class="expense-solo-field">
        <span>只看费用</span>
        <select class="select expense-solo-select" id="expenseSoloSelect" aria-label="只看费用">
          <option value="">选择费用</option>
          ${expenseOrder.map(key => `<option value="${key}" ${singleExpense === key ? "selected" : ""}>${key}</option>`).join("")}
        </select>
      </label>
    </div>
    ${expenseOrder.map(key => `
      <button type="button" class="legend-button ${state.hiddenExpenses.has(key) ? "muted" : "active"}" data-expense="${key}">
        <span class="swatch" style="background:${expenseColors[key]}"></span> ${key}
      </button>`).join("")}`;
  legend.querySelectorAll("button[data-expense-all]").forEach(button => {
    button.addEventListener("click", () => {
      state.hiddenExpenses = new Set();
      renderExpense();
    });
  });
  const soloSelect = document.getElementById("expenseSoloSelect");
  soloSelect.value = singleExpense || "";
  soloSelect.addEventListener("change", event => {
    const key = event.target.value;
    if (key) {
      state.hiddenExpenses = new Set(expenseOrder.filter(item => item !== key));
      renderExpense();
    }
  });
  legend.querySelectorAll("button[data-expense]").forEach(button => {
    button.addEventListener("click", () => {
      const key = button.dataset.expense;
      if (state.hiddenExpenses.has(key)) state.hiddenExpenses.delete(key);
      else state.hiddenExpenses.add(key);
      renderExpense();
    });
    button.addEventListener("mouseenter", event => {
      const key = button.dataset.expense;
      const rows = visibleStores();
      const value = rows.reduce((sum, store) => sum + (store.expenseComponents[key] || 0), 0);
      const ttl = rows.reduce((sum, store) => sum + (store.summary.total_ttl_cost || 0), 0);
      const revenue = rows.reduce((sum, store) => sum + (store.summary.total_revenue || 0), 0);
      showTooltip(event, tooltipMarkup("当前可见店铺合计", key, [
        ["金额", fmtWan(value)],
        ["占TTL", fmtPct(ttl ? value / ttl : 0)],
        ["占确收", fmtPct(revenue ? value / revenue : 0)]
      ]));
    });
    button.addEventListener("mousemove", moveTooltip);
    button.addEventListener("mouseleave", hideTooltip);
  });

  document.getElementById("expenseBars").innerHTML = visibleStores().map(store => {
    const total = store.summary.total_ttl_cost || 1;
    const segments = activeExpenses.map(key => {
      const value = store.expenseComponents[key] || 0;
      const width = Math.max((value / total) * 100, value > 0 ? 0.4 : 0);
      const revenue = store.summary.total_revenue || 0;
      const aria = `${store.store} ${key} ${fmtWan(value)} 占TTL ${fmtPct(value / total)} 占确收 ${fmtPct(revenue ? value / revenue : 0)}`;
      return `<span class="stack-seg" tabindex="0" role="img" aria-label="${aria}" data-store="${store.store}" data-expense="${key}" data-value="${value}" data-ttl="${total}" data-revenue="${revenue}" style="width:${width}%;--color:${expenseColors[key]}"></span>`;
    }).join("");
    const singleValue = singleExpense ? (store.expenseComponents[singleExpense] || 0) : 0;
    const percentLabel = singleExpense ? `<span class="stack-percent">${fmtPct1(singleValue / total)}</span>` : "";
    return `<div class="stack-row" data-store="${store.store}">
      <div class="bar-label"><span class="swatch" style="background:${store.color}"></span>${store.store}</div>
      <div class="stack-track ${singleExpense ? "single-expense" : ""}">${segments}${percentLabel}</div>
      <div class="bar-value">${fmtWan(total)}</div>
    </div>`;
  }).join("");

  document.getElementById("expenseBars").querySelectorAll(".stack-row[data-store]").forEach(row => {
    row.addEventListener("click", () => {
      state.activeStore = row.dataset.store;
      renderActiveDependents();
    });
  });

  document.getElementById("expenseBars").querySelectorAll(".stack-seg").forEach(seg => {
    const build = () => {
      const value = Number(seg.dataset.value || 0);
      const ttl = Number(seg.dataset.ttl || 0);
      const revenue = Number(seg.dataset.revenue || 0);
      return tooltipMarkup(seg.dataset.store, seg.dataset.expense, [
        ["金额", fmtWan(value)],
        ["占TTL", fmtPct(ttl ? value / ttl : 0)],
        ["占确收", fmtPct(revenue ? value / revenue : 0)]
      ]);
    };
    seg.addEventListener("mouseenter", event => showTooltip(event, build()));
    seg.addEventListener("mousemove", moveTooltip);
    seg.addEventListener("mouseleave", hideTooltip);
    seg.addEventListener("focus", event => showTooltip(event, build()));
    seg.addEventListener("blur", hideTooltip);
  });
}

function activityValue(store, label) {
  if (label === "Total_Act_Cost") {
    return store.summary.total_act_cost;
  }
  return store.actData.reduce((sum, row) => sum + (row[`${label}_cost`] || 0), 0);
}

        const cvr = row.SO_UV_CVR || 0;
        return `<td class="activity-cell" style="--store-color:${store.color}">
          <strong>${fmtWan(row.SO_UV_UV || 0)}</strong>
          <span>${fmtInt(row.SO_UV_SO || 0)} SO · ${fmtPct(cvr)}</span>
        </td>`;
      }).join("")}
    </tr>`;
  }).join("");
  renderTrafficSalesSummary(rows);
}

function renderTrafficSalesSummary(rows) {
  const sorted = [...rows].sort((a, b) => (b.summary.total_uv || 0) - (a.summary.total_uv || 0));
  const maxUv = Math.max(...sorted.map(store => store.summary.total_uv || 0), 1);
  const totalUv = rows.reduce((sum, store) => sum + (store.summary.total_uv || 0), 0);
  const totalSo = rows.reduce((sum, store) => sum + (store.summary.traffic_so || 0), 0);
  document.getElementById("trafficSalesLegend").innerHTML = `
    <span class="metric-chip"><b>主数字</b> UV（万）</span>
    <span class="metric-chip"><b>副数字</b> SO / CVR</span>
    <span class="metric-chip"><b>条形</b> 店铺 UV 相对最大值</span>`;
  document.getElementById("trafficSalesSummary").innerHTML = `
    <div class="traffic-summary-head">
      <span>UV 效率</span>
      <span>合计 UV ${fmtWan(totalUv)} · SO ${fmtInt(totalSo)}</span>
    </div>
    ${sorted.map(store => {
      const uv = store.summary.total_uv || 0;
      const so = store.summary.traffic_so || 0;
      const cvr = store.summary.overall_conversion_rate || 0;
      return `<div class="traffic-row" data-store="${store.store}">
        <div class="bar-label"><span class="swatch" style="background:${store.color}"></span>${store.store}</div>
        <div class="traffic-track"><span class="traffic-fill" style="--width:${(uv / maxUv) * 100}%;--color:${store.color}"></span></div>
        <div class="traffic-value"><strong>${fmtWan(uv)}</strong><span>${fmtInt(so)} SO · ${fmtPct(cvr)}</span></div>
      </div>`;
    }).join("")}`;
  document.getElementById("trafficSalesSummary").querySelectorAll("[data-store]").forEach(row => {
    row.addEventListener("click", () => {
      state.activeStore = row.dataset.store;
      renderActiveDependents();
    });
  });
}

function rankInStores(store, getter, direction = "desc") {
  const sorted = [...stores].sort((a, b) => {
    const delta = (getter(a) || 0) - (getter(b) || 0);
    return direction === "asc" ? delta : -delta;
  });
  return sorted.findIndex(item => item.store === store.store) + 1;
}

function bestLob(store, getter, direction = "desc") {
  const rows = heatmapLobOrder
    .map(lob => lobRow(store, lob))
    .filter(row => row && row.LOB);
  return rows.sort((a, b) => {
    const delta = (getter(a) || 0) - (getter(b) || 0);
    return direction === "asc" ? delta : -delta;
  })[0] || {};
}

function renderStoreInsights(rows) {
  document.getElementById("storeInsights").innerHTML = rows.map(store => {
    const revenueRank = rankInStores(store, item => item.summary.total_revenue, "desc");
    const profitRank = rankInStores(store, item => item.summary.total_net_profit, "desc");
    const marginRank = rankInStores(store, item => item.summary.overall_net_profit_rate, "desc");
    const cvrRank = rankInStores(store, item => item.summary.overall_conversion_rate, "desc");
    const scaleLob = bestLob(store, row => row.Revenue, "desc");
    const profitLob = bestLob(store, row => row.Net_Val, "desc");
    const pressureLob = bestLob(store, row => row.Net_Val, "asc");
    const profitText = store.summary.total_net_profit >= 0 ? "盈利" : "亏损";
    return `<article class="store-insight" data-store="${store.store}" style="border-top-color:${store.color}">
      <h3>
        <span class="store-insight-name"><span class="swatch" style="background:${store.color}"></span>${store.store}</span>
        <span class="store-status">${profitText}</span>
      </h3>
      <div class="store-mini-grid">
        <span>确收排名<b>#${revenueRank}</b></span>
        <span>净利润排名<b>#${profitRank}</b></span>
        <span>净利率排名<b>#${marginRank}</b></span>
        <span>CVR排名<b>#${cvrRank}</b></span>
      </div>
      <p>主力品类：${scaleLob.LOB || "-"}（确收 ${fmtWan(scaleLob.Revenue || 0)}）。</p>
      <p>利润支撑：${profitLob.LOB || "-"}（净利润 ${fmtWan(profitLob.Net_Val || 0)}）。</p>
      <p>利润压力：${pressureLob.LOB || "-"}（净利润 ${fmtWan(pressureLob.Net_Val || 0)}）。</p>
    </article>`;
  }).join("");
}

function renderInsights() {
  const rows = visibleStores();
  const revenueLeader = bestStore("total_revenue", rows);
  const profitLeader = bestStore("total_net_profit", rows);
  const efficient = bestStore("total_expense_rate", rows);
  const expenseHeavy = [...rows].sort((a, b) => b.summary.total_expense_rate - a.summary.total_expense_rate)[0];
  const lossStores = rows.filter(s => s.summary.total_net_profit < 0).map(s => s.store);
  const roiLeader = bestStore("overall_traffic_roi", rows);
  const activityHeavy = [...rows].sort((a, b) => b.summary.total_act_rate - a.summary.total_act_rate)[0];

  document.getElementById("insights").innerHTML = `
    <article class="insight">
      <h3>规模与盈利不完全同步</h3>
      <p><strong>${revenueLeader.store}</strong>确收最高（${fmtWan(revenueLeader.summary.total_revenue)}），但净利润第一是<strong>${profitLeader.store}</strong>（${fmtWan(profitLeader.summary.total_net_profit)}）。</p>
    </article>
    <article class="insight">
      <h3>费用率分化明显</h3>
      <p><strong>${efficient.store}</strong> TTL费用率最低（${fmtPct(efficient.summary.total_expense_rate)}），<strong>${expenseHeavy.store}</strong>费用率最高（${fmtPct(expenseHeavy.summary.total_expense_rate)}）。</p>
    </article>
    <article class="insight">
      <h3>投流杠杆与活动压力</h3>
      <p><strong>${roiLeader.store}</strong>投流 ROI 最高（${fmtRoi(roiLeader.summary.overall_traffic_roi)}）；<strong>${activityHeavy.store}</strong>直降投入最高（${fmtPct(activityHeavy.summary.total_act_rate)}）。亏损店铺：${lossStores.join("、") || "无"}。</p>
    </article>`;

  renderStoreInsights(rows);
}

function renderActiveDependents() {
  renderBars();
  renderSummaryTable();
  renderHeatmap();
  renderScatter();
  renderActivityDetail();
  renderTrafficSalesDetail();
}

function renderAll() {
  renderPortfolio();
  renderBars();
  renderSummaryTable();
  renderHeatmap();
  renderScatter();
  renderExpense();
  renderActivity();
  renderTrafficSalesDetail();
  renderInsights();
}

initControls();
renderAll();
</script>
</body>
