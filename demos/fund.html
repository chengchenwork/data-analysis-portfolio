      doc.getElementById('real-dialog-host').innerHTML = productDetail(d.record);

      <div class="real-card-actions"><button data-action="suggest">${d.kind === "offer" ? "均分作为计划" : "按测算预算分配"}</button><div class="real-inline-actions"><button data-action="dialog-close">取消</button><button class="real-primary" data-action="allocation-apply" ${validation.valid ? "" : "disabled"}>确认应用</button></div></div></section></div>`;
    root.querySelector('[data-action="dialog-close"]')?.focus();

  function resetFilters() { Object.assign(state, { disti: "all", t2: "all", lob: "all", subLob: "all", month: "all", source: "", trail: [], page: 0, search: '', showUnpriced: false, role: 'manager' }); }
  function exportCurrent() {
    if (state.tab === 'allocation') { exportTemplates(); return; }
    const rows = state.tab === 'details' ? detailRows(scoped()) : scoped();
    const records = state.tab === 'progress' ? [["季度", "实际截至周", "指标", "单位", "周", "阶段", "数值", "数据来源", "原计划", "数据模式", "查看范围", "总代", "T2", "LOB", "Sub LOB"], ...progressData().flatMap(p => progressExportRows(p).map(row => [...row, scopeName(), state.disti, state.t2, state.lob, state.subLob]))] : [["季度", "月份（5／4／4周）", "总代", "T2 HQ ID", "T2", "LOB", "Sub LOB", "MPN", "SO预测", "ALP参考", "预算单价", "预算价格口径", "预算测算流水", "经销商测算", "MDF测算", "平台奖励测算", state.presentation ? "平台补贴（示例）" : "平台补贴", state.presentation ? "已执行金额（示例）" : "已执行金额", "数据模式", "价格来源", "预测来源"],
      ...rows.map(r => { const s = summary([r]); const known = realBudgetPrice(r) != null; return [r.quarter, state.month, r.disti, r.t2Id, r.t2, r.lob, r.subLob, r.mpn, r.periodUnits, r.alp, realBudgetPrice(r), r.budgetPriceBasis, known ? s.gmv : null, known ? s.dealer : null, known ? s.mdf : null, known ? s.reward : null, state.presentation && known ? s.subsidy : "待录入", state.presentation && known ? s.actual : "待录入", state.presentation ? '情景模拟：补贴、执行为示例' : '基础示例与预算测算', r.priceRows.map(row => `示例价格表!${r.budgetPriceColumn}${row}`).join(";"), `合成预测表!${r.sourceRow}`]; })];
    const csv = "\uFEFF" + records.map(row => row.map(value => `"${String(value ?? "待补充").replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    const link = doc.createElement("a"); link.href = url; link.download = `资金池_${state.tab === 'progress' ? 'Current_FCST_' : ''}${state.presentation ? '情景模拟_' : ''}${state.quarter}_${state.tab === 'progress' ? '13周' : state.month}.csv`; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  root.addEventListener("click", event => {
    const button = event.target.closest("button,[data-drill],[data-source],[data-offer-item]");
    if (!button) return;
    if (button.dataset.templateAction) { handleTemplateAction(button); return; }
    if (button.dataset.dataMode) { state.presentation = button.dataset.dataMode === 'demo'; state.offerMetric = 'budget'; state.notice = ''; save(); render(); return; }
    if (button.dataset.offerMetric) { state.offerMetric = button.dataset.offerMetric; render(); return; }
    if (button.dataset.clearFilter) { Object.assign(state, clearRealFilter(state, button.dataset.clearFilter)); render(); return; }
    if (button.dataset.sort) {
      state.sortDirection = state.sortKey === button.dataset.sort && state.sortDirection === 'desc' ? 'asc' : 'desc';
      state.sortKey = button.dataset.sort; state.page = 0; render(); return;
    }
    if (button.dataset.viewLob) {
      state.trail.push({ ...selection(), role: state.role, tab: state.tab });
      Object.assign(state, { tab: 'details', lob: button.dataset.viewLob, subLob: 'all', page: 0, search: '', showUnpriced: false });
      render(); return;
    }
    if (button.dataset.record) {
      const record = scoped().find(row => row.id === button.dataset.record);
      if (record) { rememberDialogFocus(); state.dialog = { kind: 'product', record }; renderDialog(); }
      return;
    }
    if (button.dataset.offerItem) { openAllocation('offer', button.dataset.offerItem); return; }
    if (button.dataset.tab) { state.tab = button.dataset.tab; state.page = 0; render(); return; }
    if (button.dataset.month) { state.month = button.dataset.month; state.page = 0; render(); return; }
    if (button.dataset.role) {
      state.role = button.dataset.role; state.lob = "all"; state.subLob = "all"; state.trail = [];
      if (state.role === "manager") { state.disti = "all"; state.t2 = "all"; }
      if (state.role === "disti") { state.disti = state.disti === "all" ? allDistis[0] : state.disti; state.t2 = "all"; }
      if (state.role === "t2") { const t = allT2s.find(t => state.disti === "all" || t.disti === state.disti); state.t2 = t?.id ?? "all"; state.disti = t?.disti ?? "all"; }
      render(); return;
    }
    if (button.dataset.drill) {
      state.trail.push({ ...selection(), role: state.role }); state[button.dataset.drill] = button.dataset.value;
      if (button.dataset.drill === "disti") { state.t2 = "all"; state.role = "disti"; }
      if (button.dataset.drill === "t2") state.role = "t2";
      if (button.dataset.drill === "lob") state.subLob = "all";
      render(); return;
    }
    if (button.dataset.source) { state.source = state.source === button.dataset.source ? "" : button.dataset.source; render(); return; }
    if (button.dataset.expand) { state.expandedLob = state.expandedLob === button.dataset.expand ? "" : button.dataset.expand; render(); return; }
    if (button.dataset.page) { state.page += Number(button.dataset.page); render(); return; }
    if (button.dataset.mode) {
      const d = state.dialog; const next = button.dataset.mode;
      if (next !== d.mode) d.values = d.values.map(value => value === "" ? "" : d.target === 0 ? 0 : Number((next === "ratio" ? Number(value) / d.target * 100 : Number(value) / 100 * d.target).toFixed(8)));
      d.mode = next; renderDialog(); return;
    }
    switch (button.dataset.action) {
      case 'view-planning': state.tab = 'allocation'; render(); break;
      case 'export-template': exportTemplates(); break;
      case 'offer-template': goToTemplate(); break;
      case 'view-progress': state.tab = 'progress'; render(); break;
      case 'progress-offer-plan': {
        if (activeTemplate(button.dataset.quarter)) { goToTemplate(button.dataset.quarter, true); break; }
        const returnPeriod = { quarter: state.quarter, month: state.month };
        state.quarter = button.dataset.quarter; state.month = 'all'; openAllocation('offer');
        state.dialog.returnPeriod = returnPeriod;
        dialogReturnSelector = `[data-action="progress-offer-plan"][data-quarter="${button.dataset.quarter}"]`;
        break;
      }
      case "reset": resetFilters(); render(); break;
      case "view-details": Object.assign(state, { tab: 'details', page: 0, search: '', showUnpriced: false }); render(); break;
      case "undo-edit": {
        const previous = edits.undo();
        if (previous) { Object.assign(state, previous.values); state.notice = `已撤销：${previous.label}`; save(); render(); }
        break;
      }
      case "back": Object.assign(state, state.trail.pop() ?? {}); render(); break;
      case "unpriced": state.tab = "details"; state.showUnpriced = true; state.page = 0; render(); break;
      case "offer-edit": openAllocation("offer"); break;
      case "budget-edit": openAllocation("budget"); break;
      case "dialog-close": closeDialog(); break;
      case "draft-restore": state.dialog.values = [...state.dialog.initialValues]; state.dialog.mode = 'amount'; renderDialog(); break;
      case "plan-clear": {
        const d = state.dialog;
        rememberEdit(d.kind === 'offer' ? '清除 Offer 分配' : '清除预算分配');
        if (d.kind === 'offer') delete offerPlans(d.presentation)[d.scope]; else delete allocationPlans(d.presentation)[`${d.scope}|${d.key}`];
        save(); closeDialog(true); break;
      }
      case "export": exportCurrent(); break;
      case "suggest": {
        const d = state.dialog; const baseTotal = d.items.reduce((sum, item) => sum + (item.summary?.budget ?? 1), 0);
        let assigned = 0;
        d.values = d.items.map((item, i) => { const amount = !baseTotal ? 0 : i === d.items.length - 1 ? d.target - assigned : Math.round(d.target * (item.summary?.budget ?? 1) / baseTotal); assigned += amount; return d.mode === "ratio" ? d.target ? amount / d.target * 100 : 0 : amount; });
        renderDialog(); break;
      }
      case "allocation-apply": {
        const d = state.dialog; const result = validateRealAllocation(d.values, d.target, d.mode); if (!result.valid) return;
        const values = Object.fromEntries(d.items.map((item, i) => [item.key, result.amounts[i]]));
        rememberEdit(d.kind === 'offer' ? '调整 Offer 分配' : '调整预算分配');
        if (d.kind === "offer") offerPlans(d.presentation)[d.scope] = values; else allocationPlans(d.presentation)[`${d.scope}|${d.key}`] = values;
        save(); closeDialog(true); break;
      }
    }
  });
  root.addEventListener("change", event => {
    const element = event.target;
    if (element.dataset.templateView) { state.templateUI.views[templateScope(element.dataset.templateView)] = element.value; render(); return; }
    if (element.dataset.templateCompare) { state.templateUI.compares[templateScope(element.dataset.templateCompare)] = element.value; render(); return; }
    if (element.dataset.templateChanges) { state.templateUI.changes[templateScope(element.dataset.templateChanges)] = element.checked; render(); return; }
    if (element.hasAttribute('data-template-cell')) return;
    if (element.dataset.cutoff) { state.progressWeeks[element.dataset.cutoff] = Math.max(0, Math.min(13, Number(element.value))); save(); render(); root.querySelector(`[data-cutoff="${element.dataset.cutoff}"]`)?.focus(); return; }
    if (element.dataset.progressOffer) { state.progressOffers[element.dataset.progressOffer] = element.value; render(); root.querySelector(`[data-progress-offer="${element.dataset.progressOffer}"]`)?.focus(); return; }
    if (element.dataset.demoParam && state.presentation) {
      if (!element.value || !element.checkValidity()) { element.reportValidity(); return; }
      const key = element.dataset.demoParam;
      if (state.demo[key] !== Number(element.value)) { rememberEdit('调整演示参数'); state.demo[key] = Number(element.value); save(); render(); }
      return;
    }
    if (element.dataset.filter) {
      state[element.dataset.filter] = element.value; state.page = 0; state.trail = [];
      if (element.dataset.filter === "disti") { state.t2 = "all"; state.role = state.disti === "all" ? "manager" : "disti"; }
      if (element.dataset.filter === "t2") {
        if (element.value !== "all") state.disti = allT2s.find(t => t.id === element.value).disti;
        state.role = state.t2 !== "all" ? "t2" : state.disti !== "all" ? "disti" : "manager";
      }
      if (element.dataset.filter === "lob") state.subLob = "all";
      render();
    }
    if (element.id === "real-marketing" && state.marketing !== Number(element.value)) { rememberEdit('调整 Marketing 贡献率'); state.marketing = Number(element.value); save(); render(); }
    if (element.hasAttribute("data-unpriced")) { state.showUnpriced = element.checked; state.page = 0; render(); }
  });
  root.addEventListener("input", event => {
    const element = event.target;
    if (element.hasAttribute('data-template-cell')) { updateTemplateCell(element); return; }
    if (element.dataset.templateName) { state.templateDrafts[templateScope(element.dataset.templateName)].name = element.value; save(); return; }
    if (element.id === "real-marketing") element.nextElementSibling.textContent = `${Number(element.value).toFixed(1)}%`;
    if (element.hasAttribute("data-search")) { state.search = element.value; state.page = 0; const caret = element.selectionStart; render(); const next = root.querySelector("[data-search]"); next.focus(); next.setSelectionRange(caret, caret); }
    if (element.hasAttribute("data-allocation-input")) {
      const d = state.dialog; d.values[Number(element.dataset.allocationInput)] = element.value;
      const validation = validateRealAllocation(d.values, d.target, d.mode);
      const label = root.querySelector("[data-validation]");
      label.textContent = `合计 ${realMoney(validation.total)} · ${validation.difference >= 0 ? "待分配" : "超出"} ${realMoney(Math.abs(validation.difference))}`;
      label.className = validation.valid ? "real-valid" : "real-pending";
      root.querySelector('[data-action="allocation-apply"]').disabled = !validation.valid;
      root.querySelector('[data-allocation-preview]').innerHTML = allocationPreview(d);
    }
  });
  root.addEventListener("keydown", event => {
    if (event.key === "Escape" && state.dialog) { closeDialog(); return; }
    if (event.key === 'Tab' && state.dialog) {
      const modal = root.querySelector('[role="dialog"]');
      const controls = [...modal.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),[tabindex="0"]')];
      const first = controls[0], last = controls.at(-1);
      if (event.shiftKey && doc.activeElement === first) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && doc.activeElement === last) { event.preventDefault(); first?.focus(); }
    }
    const target = event.target.closest('[role="button"][data-drill],[role="button"][data-source],[role="button"][data-offer-item]');
    if (target && (event.key === "Enter" || event.key === " ")) { event.preventDefault(); target.click(); }
  });
  function showTooltip(event) {
    if (state.dialog) return;
    const target = event.target.closest('[data-real-tooltip]');
    const tooltip = doc.getElementById('real-chart-tooltip');
    if (!target || !tooltip) return;
    tooltip.textContent = target.dataset.realTooltip;
    tooltip.hidden = false;
    const rect = target.getBoundingClientRect();
    const width = tooltip.getBoundingClientRect().width;
    tooltip.style.left = `${Math.max(8, Math.min(innerWidth - width - 8, rect.left + rect.width / 2 - width / 2))}px`;
    tooltip.style.top = `${Math.max(8, rect.top - tooltip.offsetHeight - 10)}px`;
    target.setAttribute('aria-describedby', tooltip.id);
  }
  function hideTooltip() {
    const tooltip = doc.getElementById('real-chart-tooltip');
    if (tooltip) tooltip.hidden = true;
    root.querySelectorAll('[aria-describedby="real-chart-tooltip"]').forEach(el => el.removeAttribute('aria-describedby'));
  }
  root.addEventListener('pointerover', showTooltip);
  root.addEventListener('focusin', showTooltip);
  root.addEventListener('pointerout', event => { const target = event.target.closest('[data-real-tooltip]'); if (!target?.contains(event.relatedTarget)) hideTooltip(); });
  root.addEventListener('focusout', hideTooltip);
  root.addEventListener('toggle', event => { if (event.target.matches('.real-demo-settings')) state.demoSettingsOpen = event.target.open; }, true);
  doc.defaultView.addEventListener('scroll', hideTooltip, true);
  render();
  return { state, render, summary: () => summary(scoped()), progress: progressData };
}

window.realFundDashboard=mountRealDashboard(JSON.parse(document.getElementById("real-fund-data").textContent));</script></body></html>
