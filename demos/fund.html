.main-content-wrapper.role-dashboard-mode {
  display: contents;
}

.main-content-wrapper.role-dashboard-mode > :not(.workspace-tabs) {
  display: none !important;
}

.source-card-dealer[data-dealer-contribution-enhanced] .source-details-box {
  gap: 0;
}

.kpi-grid.dealer-approval-removed {
  grid-template-columns: repeat(5, minmax(0, 1fr));
}

.source-card-dealer .dealer-marketing-row {
  align-items: center;
  gap: 12px;
  padding-block: 10px;
}

.dealer-marketing-control {
  display: grid;
  grid-template-columns: minmax(92px, 1fr) 42px;
  align-items: center;
  gap: 8px;
  width: min(170px, 58%);
}

.dealer-marketing-control input[type="range"] {
  width: 100%;
  min-width: 0;
  accent-color: var(--apple-blue, #0071e3);
  cursor: pointer;
}

.dealer-marketing-control output {
  color: var(--apple-blue, #0071e3);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  text-align: right;
}

.source-card-dealer .dealer-section-row {
  margin-top: 4px;
  border-top: 1px solid var(--border-subtle, #e5e5e7);
  background: rgba(0, 113, 227, .035);
  font-weight: 650;
}

.source-card-dealer .dealer-fixed-row .detail-key {
  padding-left: 12px;
}

.source-card-dealer .dealer-total-row {
  margin-bottom: 4px;
  border-top: 1px solid var(--border-subtle, #e5e5e7);
  background: rgba(0, 113, 227, .07);
  font-weight: 700;
}

.source-card-dealer .dealer-total-row .detail-val {
  color: var(--apple-blue, #0071e3);
}

@media (max-width: 767px) {
  .dealer-marketing-control {
    grid-template-columns: minmax(88px, 1fr) 42px;
    width: min(190px, 62%);
  }

  .dealer-marketing-control input[type="range"] {
    min-height: 44px;
  }
}

.role-dashboard-shell {
  max-width: 1440px;
  margin: 0 auto;
  padding: 24px 32px 48px;
  color: var(--text-primary, #1d1d1f);
  font-variant-numeric: tabular-nums;
}

.role-dashboard-shell *,
.role-dashboard-shell *::before,
.role-dashboard-shell *::after {
  box-sizing: border-box;
}

.role-toolbar {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}

.role-toolbar > div:first-child {
  display: grid;
  gap: 7px;
}

.role-view-label,
.role-entity-label {
  color: var(--text-secondary, #6e6e73);
  font-size: 12px;
  font-weight: 650;
  letter-spacing: .02em;
}

.role-choice {
  display: inline-flex;
  padding: 3px;
  border-radius: 999px;
  background: #7676801f;
}

.role-choice button {
  border: 0;
  background: transparent;
  padding: 7px 16px;
  border-radius: 999px;
  color: inherit;
  cursor: pointer;
  font: inherit;
}

.role-choice button[aria-pressed="true"] {
  background: #fff;
  box-shadow: 0 2px 6px #00000014;
  font-weight: 650;
}

.role-choice button:focus-visible,
.role-entity-label select:focus-visible {
  outline: 3px solid #0071e34d;
  outline-offset: 2px;
}

.role-entity-label {
  display: grid;
  min-width: 240px;
  gap: 7px;
}

.role-entity-label select {
  width: 100%;
  min-height: 36px;
  border: 1px solid var(--border-subtle, #d2d2d7);
  border-radius: 10px;
  background: #fff;
  padding: 7px 34px 7px 11px;
  color: var(--text-primary, #1d1d1f);
  font: inherit;
}

.role-toolbar-context {
  display: grid;
  justify-items: end;
  gap: 7px;
  margin-left: auto;
}

.role-toolbar-context > p {
  max-width: 360px;
  margin: 0;
  color: var(--text-secondary, #6e6e73);
  font-size: 13px;
  text-align: right;
}

.role-toolbar-context > p strong {
  color: var(--text-primary, #1d1d1f);
}

.role-period-rail {
  display: grid;
  grid-template-columns: minmax(150px, .55fr) minmax(390px, 1.45fr) auto;
  align-items: end;
  gap: 14px;
  margin: -4px 0 18px;
  padding: 12px 14px;
  border: 1px solid #dfe7f0;
  border-radius: 16px;
  background: linear-gradient(120deg, #f8fbff, #fff 62%);
  box-shadow: 0 8px 24px rgba(29, 29, 31, .045);
}

.role-period-rail > label,
.role-period-rail > div:not(.role-month-editor) {
  display: grid;
  gap: 6px;
  color: var(--text-secondary, #6e6e73);
  font-size: 11px;
  font-weight: 650;
}

.role-period-rail select {
  min-height: 34px;
  border: 1px solid #d2d2d7;
  border-radius: 9px;
  background: #fff;
  padding: 6px 30px 6px 10px;
  color: #1d1d1f;
  font: inherit;
}

.role-month-switch,
.role-month-mode {
  display: inline-flex;
  width: fit-content;
  padding: 2px;
  border-radius: 9px;
  background: #eef1f5;
}

.role-month-switch button,
.role-month-mode button,
.role-month-edit,
.role-month-editor-footer button {
  min-height: 30px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  padding: 5px 11px;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 11px;
  font-weight: 650;
}

.role-month-switch button[aria-pressed="true"],
.role-month-mode button[aria-pressed="true"] {
  color: #005db5;
  background: #fff;
  box-shadow: 0 2px 7px rgba(29, 29, 31, .1);
}

.role-month-edit,
.role-month-editor-footer button[data-month-apply] {
  color: #fff;
  background: #0071e3;
}

.role-period-rail--editing {
  grid-template-columns: 150px minmax(360px, .8fr) minmax(480px, 1.2fr);
  align-items: start;
}

.role-month-editor {
  display: grid;
  gap: 9px;
}

.role-month-inputs {
  display: grid;
  grid-template-columns: repeat(3, minmax(100px, 1fr));
  gap: 8px;
}

.role-month-inputs label {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 3px 6px;
  color: #6e6e73;
  font-size: 10px;
}

.role-month-inputs label > span { grid-column: 1 / -1; }

.role-month-inputs input {
  min-width: 0;
  min-height: 34px;
  border: 1px solid #d2d2d7;
  border-radius: 8px;
  padding: 6px 8px;
  font: inherit;
}

.role-month-editor-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;
}

.role-month-editor-footer [data-month-validation] {
  margin-right: auto;
  color: #6e6e73;
  font-size: 10px;
}

.role-month-editor-footer .is-invalid { color: #b42318; }
.role-month-editor-footer .is-valid { color: #247a3c; }
.role-month-editor-footer button:disabled { opacity: .45; cursor: not-allowed; }

.role-interaction-controls {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;
  min-width: 0;
}

.role-metric-switch {
  display: inline-flex;
  padding: 2px;
  border-radius: 9px;
  background: #f0f1f3;
}

.role-metric-switch button,
.role-back,
.role-reset {
  min-height: 30px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 11px;
  font-weight: 650;
}

.role-metric-switch button {
  padding: 5px 12px;
}

.role-metric-switch button[aria-pressed="true"] {
  color: #005db5;
  background: #fff;
  box-shadow: 0 2px 7px rgba(29, 29, 31, .1);
}

.role-back,
.role-reset {
  padding: 5px 10px;
  color: #006dcc;
}

.role-reset {
  border: 1px solid #dce5ef;
}

.role-focus-chip {
  overflow: hidden;
  padding: 5px 9px;
  border-radius: 999px;
  color: #075ca8;
  background: #eaf4ff;
  font-size: 10px;
  font-weight: 650;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.role-kpi-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
}

.role-focus--manager + .role-kpi-grid {
  grid-template-columns: repeat(5, minmax(0, 1fr));
}

.role-focus--manager + .role-kpi-grid--focused {
  grid-template-columns: repeat(5, minmax(0, 1fr));
}

.role-kpi {
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--border-subtle, #e5e5ea);
  border-radius: var(--radius-lg, 16px);
  background: linear-gradient(145deg, #fff, #fbfbfd);
}

.role-kpi span {
  display: block;
  overflow: hidden;
  margin-bottom: 7px;
  color: var(--text-secondary, #6e6e73);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.role-kpi strong {
  display: block;
  overflow-wrap: anywhere;
  font-size: clamp(16px, 1.7vw, 23px);
  letter-spacing: -.025em;
}

.role-focus--manager + .role-kpi-grid .role-kpi strong {
  overflow: hidden;
  font-size: clamp(15px, 1.25vw, 18px);
  letter-spacing: -.04em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.role-chart-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  margin-top: 16px;
}

.role-chart-grid--management {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.role-chart-grid--management > .role-source-portfolio { order: 1; }
.role-chart-grid--management > [aria-label$="执行对比"] {
  grid-column: span 2;
  order: 1;
}
.role-chart-grid--management > [aria-label="Offer 构成"] {
  grid-column: 1 / -1;
  order: 2;
}
.role-chart-grid--management > [aria-label="资金流向"] { order: 3; }
.role-chart-grid--management > [aria-label="LOB 健康度矩阵"] { order: 4; }
.role-chart-grid--management > [aria-label$="经营效率"] { order: 5; }
.role-chart-grid--management > [aria-label="风险提示"] {
  grid-column: 1 / -1;
  order: 6;
}

.role-chart-grid--t2 > [aria-label="风险提示"] {
  grid-column: 1 / -1;
}

.role-chart-card {
  min-width: 0;
  padding: 18px;
  border: 1px solid var(--border-subtle, #e5e5ea);
  border-radius: var(--radius-lg, 16px);
  background: #fff;
  box-shadow: 0 10px 30px rgba(29, 29, 31, .035);
  transition: box-shadow .22s ease, transform .22s ease;
}

.role-chart-card--wide {
  grid-column: 1 / -1;
}

.role-chart-card h3 {
  margin: 0;
  font-size: 15px;
  letter-spacing: -.01em;
}

.role-focus {
  position: relative;
  display: grid;
  grid-template-columns: minmax(180px, .75fr) minmax(260px, 1.5fr) auto;
  align-items: center;
  gap: 24px;
  overflow: hidden;
  margin-bottom: 14px;
  padding: 22px 24px;
  border: 1px solid #c7ddf7;
  border-radius: 18px;
  color: #f5f9ff;
  background: linear-gradient(112deg, #082a4c 0%, #0a4c86 58%, #0879d1 100%);
  box-shadow: 0 18px 42px rgba(0, 74, 139, .14);
}

.role-focus::after {
  position: absolute;
  right: -56px;
  width: 210px;
  height: 210px;
  border: 1px solid rgba(255, 255, 255, .2);
  border-radius: 50%;
  box-shadow: 0 0 0 28px rgba(255, 255, 255, .04), 0 0 0 58px rgba(255, 255, 255, .025);
  content: "";
}

.role-focus--disti {
  background: linear-gradient(112deg, #291447 0%, #5f2e8c 58%, #9b4fd0 100%);
}

.role-focus--t2 {
  background: linear-gradient(112deg, #063b38 0%, #087a66 58%, #1aa985 100%);
}

.role-focus > * {
  position: relative;
  z-index: 1;
}

.role-focus h2 {
  margin: 3px 0 0;
  font-size: clamp(19px, 2vw, 27px);
  letter-spacing: -.03em;
}

.role-focus p {
  margin: 0;
  color: rgba(255, 255, 255, .88);
  font-size: 15px;

  font: inherit;
  text-align: left;
  transition: background .18s ease, transform .18s ease;
}

.role-risk:hover,
.role-risk:focus-visible {
  background: #fff8e8;
  transform: translateX(2px);
}

.role-data-table tbody tr[role="button"] {
  transition: background .18s ease;
}

.role-data-table tbody tr[role="button"]:hover,
.role-data-table tbody tr[role="button"]:focus-visible {
  outline: 0;
  background: #f3f8ff;
}

.role-is-highlighted {
  outline: 3px solid rgba(0, 113, 227, .35) !important;
  outline-offset: 3px;
  animation: role-highlight-pulse 1.2s ease 2;
}

[data-role-tooltip] {
  position: relative;
}

.role-live-tooltip {
  position: fixed;
  z-index: 1000;
  width: max-content;
  max-width: min(340px, calc(100vw - 32px));
  padding: 8px 10px;
  border-radius: 8px;
  color: #fff;
  background: rgba(20, 24, 31, .94);
  box-shadow: 0 8px 22px rgba(0, 0, 0, .18);
  font-size: 10px;
  font-weight: 500;
  line-height: 1.4;
  pointer-events: none;
  text-align: left;
  transform: translate(-50%, -100%);
  white-space: normal;
}

.role-live-tooltip[hidden] {
  display: none;
}

@keyframes role-highlight-pulse {
  50% { box-shadow: 0 0 0 7px rgba(0, 113, 227, .12); }
}

.role-risk > span {
  padding: 3px 7px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
}

.role-risk > strong {
  overflow: hidden;
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.role-risk > small {
  color: var(--text-secondary, #6e6e73);
  white-space: nowrap;
}

.role-risk--over {
  border-color: #ff3b30;
}

.role-risk--over > span {
  color: #b42318;
  background: #fee4e2;
}

.role-risk--high {
  border-color: #ff9f0a;
}

.role-risk--high > span {
  color: #9a6700;
  background: #fff3cd;
}

.role-risk--low {
  border-color: #0071e3;
}

.role-risk--low > span {
  color: #0057b8;
  background: #e8f2ff;
}

.role-mdf-value {
  display: block;
  margin-top: 16px;
  font-size: 18px;
}

.role-mdf-details {
  display: grid;
  gap: 7px;
  margin-top: 12px;
  color: var(--text-secondary, #6e6e73);
  font-size: 12px;
}

@media (max-width: 900px) {
  .role-offer-editor-rows {
    grid-template-columns: 1fr;
  }

  .role-kpi-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .role-focus--manager + .role-kpi-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .role-focus--manager + .role-kpi-grid--focused {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .role-focus--manager + .role-kpi-grid .role-kpi strong {
    white-space: normal;
  }

  .role-chart-grid,
  .role-chart-grid--management {
    grid-template-columns: 1fr;
  }

  .role-chart-card--wide {
    grid-column: auto;
  }

  .role-sub-lob-toggle {
    grid-template-columns: minmax(0, 1fr) 18px;
    gap: 10px 14px;
  }

  .role-sub-lob-summary {
    grid-column: 1 / -1;
    grid-row: 2;
    gap: 10px;
  }

  .role-sub-lob-chevron {
    grid-column: 2;
    grid-row: 1;
  }

  .role-toolbar {
    align-items: stretch;
    flex-direction: column;
  }

  .role-period-rail,
  .role-period-rail--editing {
    grid-template-columns: 1fr;
    align-items: stretch;
  }

  .role-toolbar-context {
    justify-items: start;
    margin-left: 0;
  }

  .role-toolbar-context > p {
    max-width: none;
    text-align: left;
  }

  .role-entity-label {
    min-width: 0;
  }

  .role-focus {
    grid-template-columns: 1fr auto;
  }

  .role-focus p {
    grid-column: 1 / -1;
  }

  .role-interaction-controls {
    justify-content: flex-start;
    flex-wrap: wrap;
  }

  .role-reset {
    margin-left: 0;
  }
}

@media (max-width: 520px) {
  .role-dashboard-shell {
    padding: 18px 16px 36px;
  }

  .role-kpi-grid {
    grid-template-columns: 1fr;
  }

  .role-card-heading {
    align-items: stretch;
    flex-direction: column;
  }

  .role-offer-heading-actions,
  .role-offer-mode {
    flex-wrap: wrap;
  }

  .role-offer-card button {
    min-height: 44px;
  }

  .role-focus--manager + .role-kpi-grid {
    grid-template-columns: 1fr;
  }

  .role-focus--manager + .role-kpi-grid--focused {
    grid-template-columns: 1fr;
  }

  .role-choice {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
  }

  .role-month-switch {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    width: 100%;
  }

  .role-month-inputs {
    grid-template-columns: 1fr;
  }

  .role-month-editor-footer {
    flex-wrap: wrap;
  }

  .role-month-editor-footer [data-month-validation] {
    width: 100%;
  }

  .role-bar-row {
    grid-template-columns: minmax(76px, .7fr) minmax(80px, 1.3fr);
  }

  .role-bar-row > span {
    grid-column: 2;
    text-align: left;
  }

  .role-bar-rate {
    grid-column: 2;
    text-align: left;
  }

  .role-donut-layout {
    grid-template-columns: 1fr;
  }

  .role-risk {
    grid-template-columns: auto minmax(0, 1fr);
  }

  .role-risk > small {
    grid-column: 2;
  }

  .role-focus {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 19px;
  }

  .role-focus > span {
    justify-self: start;
  }

  .role-source-layout {
    grid-template-columns: 1fr;
  }

  .role-source-ring {
    width: 168px;
  }

  .role-card-heading {
    align-items: start;
    flex-direction: column;
  }

  .role-card-heading > strong,
  .role-card-heading > span {
    text-align: left;
  }

  .role-waterfall {
    gap: 8px;
    height: 210px;
    padding-inline: 0;
  }

  .role-waterfall-step > strong {
    font-size: 9px;
  }

  .role-metric-switch {
    order: 1;
    width: 100%;
  }

  .role-metric-switch button {
    flex: 1;
  }

  .role-back { order: 2; }
  .role-focus-chip { order: 3; max-width: calc(100% - 98px); }
  .role-reset { order: 4; margin-left: auto; }

}

@media (prefers-reduced-motion: reduce) {
  .role-dashboard-shell *,
  .role-dashboard-shell *::before,
  .role-dashboard-shell *::after {
    scroll-behavior: auto !important;
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}

.real-page-heading p{font-size:12px;line-height:1.7;color:#6e6e73;margin:6px 0 0}
.real-page-heading>button{flex-shrink:0}
.real-planning-rates{border:1px solid #e5e8ee;border-radius:16px;background:white;margin:0 0 24px;min-width:0}
.real-planning-rates>summary{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;cursor:pointer;font-size:13px;list-style:none}
.real-planning-rates>summary::-webkit-details-marker{display:none}

.real-planning-rates[open]>summary>strong:before{content:'−'}
.real-planning-rates>summary>span{font-size:11px;color:#6e6e73}
.real-planning-rates .real-source-container{margin:0;border:0;border-radius:0 0 16px 16px;box-shadow:none}
.real-planning-rates>.role-chart-card{border:0;border-radius:0 0 16px 16px;box-shadow:none;margin:0}
.real-planning-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.real-planning-grid>.role-chart-card{grid-column:auto;min-width:0;min-height:0}
.real-planning-grid .real-offer-layout{grid-template-columns:150px minmax(0,1fr);gap:20px}
.real-planning-grid .real-offer-ring{width:150px;height:150px}
.real-planning-grid .real-offer-ring strong{font-size:16px}

:119},{"id":"FY27Q1:D006:DEMO-52","quarter":"FY27Q1","disti":"示例总代 C","t2Id":"D006","t2":"示例经销商 06","lob":"AirPods","subLob":"耳机 B","mpn":"DEMO-52","variant":"标准款","productDescription":"合成示例 耳机 B","soUnits":767,"weeks":[42,49,56,63,70,77,84,91,33,40,47,54,61],"alp":1100,"priceRows":[120],"priceProduct":"耳机示例","priceVariant":"标准款","priceStatus":"matched","priceReason":"","lowestPrice":1000,"budgetPrice":1000,"budgetPriceBasis":"示例预算价","budgetPriceColumn":"B","budgetPriceReason":"","sourceRow":120}],"quarters":[{"quarter":"FY26Q4","rows":60,"soUnits":49205,"pricedUnits":48464,"pricedGmv":169435500,"unpricedUnits":741,"alpFallbackUnits":715},{"quarter":"FY27Q1","rows":60,"soUnits":49205,"pricedUnits":48438,"pricedGmv":171927600,"unpricedUnits":767,"alpFallbackUnits":806}],"unmatched":[],"excluded":{"rows":0,"lob":"示例之外","soUnits":0},"sourceRowCount":120,"maxQuarterDifference":0}</script><script type="module">const REAL_LOBS = ["iPhone", "Mac", "iPad", "Watch", "AirPods"];
const MDF_RATES = {iPhone:0.012,Mac:0.018,iPad:0.015,Watch:0.01,AirPods:0.014};
const REAL_OFFERS = ["分期付款", "以旧换新", "地补", "现金直降", "积分", "会员优惠"];
const REAL_FIXED_COSTS = [["渠道服务",0.8],["运营支持",0.6],["活动支持",0.4],["资金成本",0.5],["物流",0.7],["其他服务",0.5],["平台服务",2.0]];
const FINANCIAL_MONTHS = [[0, 5], [5, 9], [9, 13]];
const realBudgetPrice = record => record.budgetPrice ?? record.alp;

function realPeriodUnits(record, month = "all") {
  if (month === "all") return record.soUnits;
  const range = FINANCIAL_MONTHS[Number(month) - 1];
  return range ? record.weeks.slice(...range).reduce((sum, units) => sum + units, 0) : 0;
}

function selectRealRecords(records, selection = {}) {
  return records.filter(r => (!selection.quarter || selection.quarter === "all" || r.quarter === selection.quarter)
    && (!selection.disti || selection.disti === "all" || r.disti === selection.disti)
    && (!selection.t2 || selection.t2 === "all" || r.t2Id === selection.t2)
    && (!selection.lob || selection.lob === "all" || r.lob === selection.lob)
    && (!selection.subLob || selection.subLob === "all" || r.subLob === selection.subLob))
    .map(r => ({ ...r, periodUnits: realPeriodUnits(r, selection.month) }))
    .filter(r => r.periodUnits !== 0 || ((!selection.month || selection.month === "all") && r.weeks?.some(units => units !== 0))
      || (selection.includeActuals && (r.soActuals?.some(Number.isFinite) || Object.values(r.offerActuals ?? {}).some(weeks => weeks.some(Number.isFinite)))));
}

// Presentation assumptions are an overlay; source records and real-mode nulls stay untouched.
const PRESENTATION_OFFER_WEIGHTS = {
  iPhone: [32, 16, 10, 16, 12, 14], Mac: [42, 12, 6, 22, 6, 12],
  iPad: [28, 12, 8, 30, 10, 12], Watch: [12, 8, 6, 32, 22, 20], AirPods: [10, 2, 4, 38, 26, 20],
};
function presentationExecutionRate(record, baseline = 85) {
  const identity = [record.quarter, record.disti, record.t2Id, record.lob].join('|');
  let hash = 0;
  for (const char of identity) hash = (Math.imul(hash, 31) + char.charCodeAt(0)) >>> 0;
  return (baseline + hash % 35 - 15) / 100;
}

function summarizeRealRecords(records, marketingRate = 1, options = {}) {
  let soUnits = 0, pricedUnits = 0, unpricedUnits = 0, gmv = 0, mdf = 0, missingRows = 0;
  for (const record of records) {
    const units = record.periodUnits ?? record.soUnits;
    soUnits += units;
    const price = realBudgetPrice(record);
    if (price == null) { unpricedUnits += units; missingRows++; continue; }
    const amount = units * price;
    pricedUnits += units;
    gmv += amount;
    mdf += amount * (MDF_RATES[record.lob] ?? 0);
  }
  const dealer = gmv * marketingRate / 100;
  const reward = gmv * 0.005;
  const result = { soUnits, pricedUnits, unpricedUnits, missingRows, gmv, dealer, mdf, reward, subsidy: null,
    budget: dealer + mdf + reward, actual: null, executionRate: null,
    coverage: soUnits ? pricedUnits / soUnits : null, count: records.length };
  if (!options.presentation) return result;
  const subsidyPct = Math.max(0, Math.min(3, Number.isFinite(options.subsidyPct) ? options.subsidyPct : 1.2));
  const executionPct = Math.max(50, Math.min(110, Number.isFinite(options.executionPct) ? options.executionPct : 85));
  result.subsidy = gmv * subsidyPct / 100;
  result.budget += result.subsidy;
  result.actual = 0;
  result.offers = Object.fromEntries(REAL_OFFERS.map(name => [name, 0]));
  result.offerActuals = Object.fromEntries(REAL_OFFERS.map(name => [name, 0]));
  for (const record of records) {
    const price = realBudgetPrice(record);
    if (price == null) continue;
    const revenue = (record.periodUnits ?? record.soUnits) * price;
    const budget = revenue * (marketingRate / 100 + (MDF_RATES[record.lob] ?? 0) + .005 + subsidyPct / 100);
    // Keep signed weekly adjustments so the three monthly groups sum to the quarter.
    const actual = budget * presentationExecutionRate(record, executionPct);
    result.actual += actual;
    const weights = PRESENTATION_OFFER_WEIGHTS[record.lob] ?? PRESENTATION_OFFER_WEIGHTS.iPhone;
    REAL_OFFERS.forEach((name, i) => {
      result.offers[name] += budget * weights[i] / 100;
      result.offerActuals[name] += actual * weights[i] / 100;
    });
  }
  result.executionRate = result.budget > 0 ? result.actual / result.budget : null;
  return result;
}

function groupRealRecords(records, key, marketingRate = 1, options = {}) {
  const groups = new Map();
  for (const record of records) {
    const value = record[key];
    if (!groups.has(value)) groups.set(value, []);
    groups.get(value).push(record);
  }
  return [...groups].map(([value, rows]) => ({ key: value, label: key === "t2Id" ? rows[0].t2 : value, records: rows, summary: summarizeRealRecords(rows, marketingRate, options) }))
    .sort((a, b) => key === "lob" ? REAL_LOBS.indexOf(a.key) - REAL_LOBS.indexOf(b.key) : b.summary.budget - a.summary.budget);
}

function validateRealAllocation(values, target, mode = "amount") {
  if (!Number.isFinite(target) || target < 0) return { valid: false, total: 0, difference: target, amounts: [] };
  const validInputs = values.every(value => value !== "" && Number.isFinite(Number(value)) && Number(value) >= 0);
  const amounts = values.map(value => mode === "ratio" ? Number(value) * target / 100 : Number(value));
  const total = amounts.reduce((sum, amount) => sum + amount, 0);
  const difference = target - total;
  return { valid: validInputs && Math.abs(difference) < 0.05, total, difference, amounts };
}


function realDetailRows(rows, { search = '', showUnpriced = false, sortKey = '', sortDirection = 'desc' } = {}) {
  const term = search.trim().toLowerCase();
  const filtered = rows.filter(row => (!showUnpriced || realBudgetPrice(row) == null)
    && (!term || `${row.mpn} ${row.t2} ${row.subLob} ${row.variant}`.toLowerCase().includes(term)));
  const getters = { so: r => r.periodUnits ?? r.soUnits, alp: r => r.alp, budgetPrice: realBudgetPrice, gmv: r => realBudgetPrice(r) == null ? null : realBudgetPrice(r) * (r.periodUnits ?? r.soUnits), mpn: r => r.mpn };
  const get = getters[sortKey];
  if (!get) return filtered;
  return filtered.sort((a, b) => {
    const left = get(a), right = get(b);
    if (left == null) return right == null ? 0 : 1;
    if (right == null) return -1;
    const delta = typeof left === 'string' ? left.localeCompare(right, 'zh-CN') : left - right;
    return (sortDirection === 'asc' ? 1 : -1) * delta;
  });
}

function clearRealFilter(state, key) {
  const next = { ...state, page: 0, trail: [] };
  if (key === 'search') next.search = '';
  else if (key === 'showUnpriced') next.showUnpriced = false;
  else if (key === 'source') next.source = '';
  else next[key] = 'all';
  if (key === 'disti') next.t2 = 'all';
  if (key === 'lob') next.subLob = 'all';
  next.role = next.t2 && next.t2 !== 'all' ? 't2' : next.disti && next.disti !== 'all' ? 'disti' : 'manager';
  return next;
}

function createRealEditHistory() {
  const entries = [];
  return {
    capture(state, label) {
      entries.push({ label, values: JSON.parse(JSON.stringify({ marketing: state.marketing, offers: state.offers, allocations: state.allocations, ...(state.demo ? { demo: state.demo } : {}) })) });
      if (entries.length > 20) entries.shift();
    },
    undo: () => entries.pop() ?? null,
    get latest() { return entries.at(-1)?.label ?? ''; },
  };
}


const completeProgressSum = values => values.every(Number.isFinite) ? values.reduce((sum, value) => sum + value, 0) : null;
const progressCutoff = value => Number.isFinite(Number(value)) ? Math.max(0, Math.min(13, Math.trunc(Number(value)))) : 5;

function splitCurrentForecast(plan, actual, cutoffWeek = 5, sources = {}) {
  const cutoff = progressCutoff(cutoffWeek);
  const weeks = Array.from({ length: 13 }, (_, index) => {
    const phase = index < cutoff ? 'current' : 'fcst';
    const value = (phase === 'current' ? actual : plan)?.[index];
    return { week: index + 1, phase, plan: Number.isFinite(plan?.[index]) ? plan[index] : null,
      value: Number.isFinite(value) ? value : null,
      source: sources[phase]?.[index] ?? (Number.isFinite(value) ? phase === 'current' ? '实际数据' : '预测' : '待录入') };
  });
  const current = completeProgressSum(weeks.slice(0, cutoff).map(w => w.value));
  const fcst = completeProgressSum(weeks.slice(cutoff).map(w => w.value));
  const total = completeProgressSum([current, fcst]);
  const original = completeProgressSum(weeks.map(w => w.plan));
  return { weeks, current, fcst, total, original,
    completion: total > 0 && current != null ? current / total : null,
    variance: total != null && original != null ? total - original : null };
}

function buildQuarterProgress(records, options = {}) {
  const { quarter, presentation = false, marketingRate = 1, offerAllocation } = options;
  const rows = records.filter(r => r.quarter === quarter);
  const cutoffWeek = progressCutoff(options.cutoffWeek ?? 5);
  const summaries = Array.from({ length: 13 }, (_, i) => summarizeRealRecords(rows.map(r => ({ ...r, periodUnits: r.weeks[i] })), marketingRate, options));
  const soPlan = Array.from({ length: 13 }, (_, i) => rows.reduce((sum, r) => sum + r.weeks[i], 0));
  const soActual = Array.from({ length: 13 }, (_, i) => completeProgressSum(rows.map(r => Number.isFinite(r.soActuals?.[i]) ? r.soActuals[i]
    : presentation ? r.weeks[i] * presentationExecutionRate(r, 95) : null)));
  const soSources = Array.from({ length: 13 }, (_, i) => !rows.length ? '无记录' : rows.every(r => Number.isFinite(r.soActuals?.[i])) ? '实际数据' : presentation ? '示例实际' : '待录入');
  const so = { key: 'so', label: 'SO', unit: '台', ...splitCurrentForecast(soPlan, soActual, cutoffWeek, { current: soSources, fcst: Array(13).fill('源表 SO 预测') }) };
  const savedPlan = offerAllocation && REAL_OFFERS.every(name => Number.isFinite(offerAllocation[name]) && offerAllocation[name] >= 0) ? offerAllocation : null;
  const weeklyPlan = Array.isArray(options.offerWeeklyPlan) ? options.offerWeeklyPlan : null;
  const budgetTotal = summaries.reduce((sum, s) => sum + s.budget, 0);
  const savedTotal = savedPlan ? REAL_OFFERS.reduce((sum, name) => sum + savedPlan[name], 0) : 0;
  const offers = REAL_OFFERS.map(name => {
    const plan = summaries.map((s, i) => weeklyPlan ? weeklyPlan[i]?.[name] ?? null : savedPlan ? savedPlan[name] * (budgetTotal ? s.budget / budgetTotal : 1 / 13) : presentation ? s.offers[name] : null);
    const actual = summaries.map((s, i) => {
      const known = completeProgressSum(rows.map(r => r.offerActuals?.[name]?.[i]));
      if (known != null) return known;
      if (!presentation) return null;
      const exampleAmount = summary => savedPlan ? savedTotal > 0 ? summary.actual * savedPlan[name] / savedTotal : 0 : summary.offerActuals[name];
      if (!rows.some(r => Number.isFinite(r.offerActuals?.[name]?.[i]))) return exampleAmount(s);
      return rows.reduce((sum, r) => sum + (Number.isFinite(r.offerActuals?.[name]?.[i]) ? r.offerActuals[name][i]
        : exampleAmount(summarizeRealRecords([{ ...r, periodUnits: r.weeks[i] }], marketingRate, options))), 0);
    });
    const sources = {
      current: summaries.map((_, i) => rows.every(r => Number.isFinite(r.offerActuals?.[name]?.[i])) ? rows.length ? '实际数据' : '无记录' : presentation ? rows.some(r => Number.isFinite(r.offerActuals?.[name]?.[i])) ? '实际数据 + 示例执行补充' : '示例执行' : '待录入'),
      fcst: Array(13).fill(weeklyPlan ? options.offerPlanLabel ?? '版本模板按周测算' : savedPlan ? presentation ? '演示计划按周测算资金分配' : '录入计划按周测算资金分配' : presentation ? '示例 Offer 预测' : '待录入'),
    };
    return { key: name, label: name, unit: '元', ...splitCurrentForecast(plan, actual, cutoffWeek, sources) };
  });
  const totalPlan = summaries.map((_, i) => completeProgressSum(offers.map(offer => offer.weeks[i].plan)));
  const totalActual = summaries.map((_, i) => completeProgressSum(offers.map(offer => offer.weeks[i].value)));
  const offerTotal = { key: 'offer', label: 'Offer 合计', unit: '元', ...splitCurrentForecast(totalPlan, totalActual, cutoffWeek, {
    current: Array(13).fill(presentation ? '示例执行' : '实际数据／待录入'),
    fcst: Array(13).fill(weeklyPlan ? options.offerPlanLabel ?? '版本模板按周测算' : savedPlan ? '季度计划按周分配' : presentation ? '示例 Offer 预测' : '待录入'),
  }) };
  return { quarter, cutoffWeek, so, offers, offerTotal, count: rows.length, presentation,
    hasOfferPlan: !!weeklyPlan || !!savedPlan || presentation,
    staleOfferPlan: !weeklyPlan && !!savedPlan && Math.abs(savedTotal - Math.round(budgetTotal)) >= .05 };
}

function progressExportRows(progress) {
  return [progress.so, ...progress.offers].flatMap(series => series.weeks.map(week => [
    progress.quarter, `W${progress.cutoffWeek}`, series.label, series.unit, `W${week.week}`,
    week.phase === 'current' ? 'Current' : 'FCST', week.value, week.source, week.plan,
    progress.presentation ? '情景模拟' : '基础示例',
  ]));
}


const progressEscape = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const progressNumber = value => value == null ? '待录入' : value.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
const progressValue = (value, unit) => value == null ? '待录入' : unit === '元' ? `¥${Math.round(value).toLocaleString('zh-CN')}` : progressNumber(value);
const progressPercent = value => value == null ? '—' : `${(value * 100).toFixed(1)}%`;
const progressShort = value => value == null ? '待录入' : Math.abs(value) >= 10000 ? `${(value / 10000).toFixed(1)}万` : progressNumber(value);

function progressChart(series, cutoff, month) {
  const values = series.weeks.map(w => w.value ?? 0);
  const positive = Math.max(...values, 1);
  const negative = Math.min(...values, 0);
  const top = positive / (positive - negative) * 100;
  const range = FINANCIAL_MONTHS[Number(month) - 1];
  return `<div class="progress-chart-scroll"><div class="progress-chart" data-progress-metric="${progressEscape(series.key)}">

const offerTemplateKey = r => JSON.stringify([r.nd ?? r.disti, r.lob, r.sub ?? r.subLob]);
const templateClone = value => JSON.parse(JSON.stringify(value));
const templateSum = values => values.every(Number.isFinite) ? values.reduce((sum, value) => sum + value, 0) : null;

function buildOfferTemplateRows(records, options = {}) {
  const grouped = new Map();
  for (const r of records.filter(r => r.quarter === options.quarter)) {
    const key = offerTemplateKey(r);
    if (!grouped.has(key)) grouped.set(key, []);
    grouped.get(key).push({ ...r, periodUnits: r.soUnits });
  }
  return [...grouped].map(([key, rows]) => {
    const r = rows[0], s = summarizeRealRecords(rows, options.marketingRate ?? 1, options);
    const inherited = Object.entries(options.legacy ?? {}).map(([scope, amounts]) => {
      const [q, month, nd, t2, lob, sub] = scope.split('|');
      const valid = q === options.quarter && month === 'all' && t2 === 'all'
        && (nd === 'all' || nd === r.disti) && (lob === 'all' || lob === r.lob) && (sub === 'all' || sub === r.subLob)
        && REAL_OFFERS.every(name => Number.isFinite(amounts[name]) && amounts[name] >= 0);
      return { valid, amounts, score: (sub !== 'all' ? 4 : 0) + (nd !== 'all' ? 2 : 0) + (lob !== 'all' ? 1 : 0) };
    }).filter(p => p.valid).sort((a, b) => b.score - a.score)[0];
    const total = inherited ? REAL_OFFERS.reduce((sum, name) => sum + inherited.amounts[name], 0) : 0;
    return { key, nd: r.disti, lob: r.lob, sub: r.subLob, budget: s.budget, missingPrices: s.missingRows,
      ratios: total > 0 ? REAL_OFFERS.map(name => inherited.amounts[name] / total * 100) : [...(PRESENTATION_OFFER_WEIGHTS[r.lob] ?? PRESENTATION_OFFER_WEIGHTS.iPhone)],
      origin: total > 0 ? '沿用已录入季度比例' : '默认计划比例' };
  }).sort((a, b) => a.nd.localeCompare(b.nd, 'zh-CN') || REAL_LOBS.indexOf(a.lob) - REAL_LOBS.indexOf(b.lob) || a.sub.localeCompare(b.sub, 'en'));
}

function validateOfferTemplate(rows) {
  const invalid = rows.filter(row => !Array.isArray(row.ratios) || row.ratios.length !== REAL_OFFERS.length
    || !row.ratios.every(value => Number.isFinite(value) && value >= 0 && value <= 100)
    || Math.abs(templateSum(row.ratios) - 100) > .00001 || !Number.isFinite(row.budget));
  const unique = new Set(rows.map(row => row.key)).size === rows.length;
  return { valid: rows.length > 0 && invalid.length === 0 && unique, invalid: invalid.map(row => row.key) };
}

function saveOfferVersion(book, draft, metadata = {}) {
  if (!validateOfferTemplate(draft.rows).valid) throw new Error('每个 ND × Sub 的 Offer% 必须完整且合计 100%');
  const previous = book?.versions ?? [];
  const number = Math.max(book?.nextNumber ?? 1, ...previous.map(v => v.number + 1));
  const version = templateClone({ ...draft, id: metadata.id ?? crypto.randomUUID(), number,
    name: String(metadata.name || `方案 ${number}`).trim().slice(0, 60), createdAt: metadata.createdAt ?? new Date().toISOString() });
  // Snapshot cloning prevents future drafts or applications from rewriting history.
  return { versions: [version, ...previous].slice(0, 5), activeId: version.id, nextNumber: number + 1 };
}

function compareOfferVersions(current, baseline) {
  const a = new Map(current.rows.map(row => [row.key, row]));
  const b = new Map((baseline?.rows ?? []).map(row => [row.key, row]));
  return [...new Set([...a.keys(), ...b.keys()])].map(key => {
    const left = a.get(key), right = b.get(key), info = left ?? right;
    const ratioDelta = REAL_OFFERS.map((_, i) => left && right && Number.isFinite(left.ratios[i]) && Number.isFinite(right.ratios[i]) ? left.ratios[i] - right.ratios[i] : null);
    const amountDelta = REAL_OFFERS.map((_, i) => left && right && ratioDelta[i] != null ? left.budget * left.ratios[i] / 100 - right.budget * right.ratios[i] / 100 : null);
    const budgetDelta = left && right ? left.budget - right.budget : null;
    return { ...info, current: left, baseline: right, ratioDelta, amountDelta, budgetDelta,
      changed: !!baseline && (!left || !right || Math.abs(budgetDelta) > .005 || ratioDelta.some(value => value != null && Math.abs(value) > .00001)) };
  });
}

function allocateTemplateOffers(records, version, marketingRate = 1, options = {}) {
  const templates = new Map(version.rows.map(row => [row.key, row]));
  const amounts = Object.fromEntries(REAL_OFFERS.map(name => [name, 0]));
  for (const r of records) {
    const plan = templates.get(offerTemplateKey(r));
    if (r.quarter !== version.quarter || !plan || !validateOfferTemplate([plan]).valid) return null;
    const budget = summarizeRealRecords([r], marketingRate, options).budget;
    REAL_OFFERS.forEach((name, i) => { amounts[name] += budget * plan.ratios[i] / 100; });
  }
  return amounts;
}

const realMoney = value => value == null || !Number.isFinite(value) ? "待录入" : `¥${Math.round(value).toLocaleString("zh-CN")}`;
const realCount = value => Number(value || 0).toLocaleString("zh-CN", { maximumFractionDigits: 2 });
const realPct = value => value == null ? "—" : `${(value * 100).toFixed(1)}%`;
const realColors = ["#0071e3", "#34c759", "#ff9f0a", "#af52de", "#64d2ff", "#5856d6"];
const realOption = (value, label, selected) => `<option value="${realEscape(value)}" ${selected === value ? "selected" : ""}>${realEscape(label)}</option>`;
const realCard = (title, content, classes = "", caption = "") => `<section class="role-chart-card ${classes}" data-role-chart aria-label="${realEscape(title)}"><div class="role-card-heading"><h3>${title}</h3>${caption ? `<span>${caption}</span>` : ""}</div>${content}</section>`;

function mountRealDashboard(dataset, doc = document) {
  const storageKey = `portfolioSyntheticFund:${dataset.version}`;
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch {}
  const state = {
    tab: "overview", quarter: "FY26Q4", month: "all", role: "manager", disti: "all", t2: "all", lob: "all", subLob: "all",
    search: "", page: 0, showUnpriced: false, expandedLob: "", source: "", trail: [], dialog: null, sortKey: "", sortDirection: "desc", notice: "",
    marketing: Number.isFinite(stored.marketing) ? Math.max(0, Math.min(1, stored.marketing)) : 1,
    offers: stored.offers ?? {}, allocations: stored.allocations ?? {},
    presentation: stored.presentation !== false, offerMetric: 'budget', demoSettingsOpen: false, planningRatesOpen: false,
    progressWeeks: Object.fromEntries(dataset.quarters.map(q => [q.quarter, Number.isInteger(stored.progressWeeks?.[q.quarter]) ? Math.max(0, Math.min(13, stored.progressWeeks[q.quarter])) : 5])),
    progressOffers: {},
    offerTemplates: { real: stored.offerTemplates?.real ?? {}, demo: stored.offerTemplates?.demo ?? {} },
    templateDrafts: stored.templateDrafts ?? {},
    templateUI: { views: {}, compares: {}, changes: {}, errors: {} },
    demo: { offers: stored.demo?.offers ?? {}, allocations: stored.demo?.allocations ?? {},
      subsidyPct: Number.isFinite(stored.demo?.subsidyPct) ? Math.max(0, Math.min(3, stored.demo.subsidyPct)) : 1.2,
      executionPct: Number.isFinite(stored.demo?.executionPct) ? Math.max(50, Math.min(110, stored.demo.executionPct)) : 85 },
  };
  const root = doc.getElementById("root");
  const edits = createRealEditHistory();
  let dialogReturnSelector = '';
  const allDistis = [...new Set(dataset.records.map(r => r.disti))].sort();
  const allT2s = [...new Map(dataset.records.map(r => [r.t2Id, { id: r.t2Id, name: r.t2, disti: r.disti }])).values()].sort((a, b) => a.name.localeCompare(b.name, "zh-CN"));
  const quarterLabel = () => state.quarter === "all" ? "两个季度合计" : state.quarter;
  const monthLabels = FINANCIAL_MONTHS.map(([start, end]) => `W${start + 1}–W${end}`);
  const periodLabel = () => `${quarterLabel()}${state.month === "all" ? " · 季度汇总" : ` · 第${state.month}月（${monthLabels[Number(state.month) - 1]}）`}`;
  const selection = () => ({ quarter: state.quarter, month: state.month, disti: state.disti, t2: state.t2, lob: state.lob, subLob: state.subLob });
  const scoped = () => selectRealRecords(dataset.records, selection());
  // Keep old 4/4/5 plans stored, but never reinterpret them as new monthly ranges.
  const scopeKey = () => [state.quarter, state.month === 'all' ? 'all' : `${state.month}@544`, state.disti, state.t2, state.lob, state.subLob].join("|");
  const assumptions = () => ({ presentation: state.presentation, subsidyPct: state.demo.subsidyPct, executionPct: state.demo.executionPct });
  const summary = rows => summarizeRealRecords(rows, state.marketing, assumptions());
  const groups = (rows, key) => groupRealRecords(rows, key, state.marketing, assumptions());
  const offerPlans = (presentation = state.presentation) => presentation ? state.demo.offers : state.offers;
  const allocationPlans = (presentation = state.presentation) => presentation ? state.demo.allocations : state.allocations;
  const scopeName = () => state.t2 !== "all" ? allT2s.find(t => t.id === state.t2)?.name ?? state.t2 : state.disti !== "all" ? state.disti : "全国汇总";
  const save = () => { try { localStorage.setItem(storageKey, JSON.stringify({ marketing: state.marketing, offers: state.offers, allocations: state.allocations, presentation: state.presentation, demo: state.demo, progressWeeks: state.progressWeeks, offerTemplates: state.offerTemplates, templateDrafts: state.templateDrafts })); return true; } catch { return false; } };
  const rememberEdit = label => { edits.capture(state, label); state.notice = `${label}已保存，可撤销`; };
  const detailRows = rows => realDetailRows(rows, state);

  const templateMode = () => state.presentation ? 'demo' : 'real';
  const templateScope = quarter => `${templateMode()}|${quarter}`;
  const templateBook = quarter => state.offerTemplates[templateMode()][quarter];
  const activeTemplate = quarter => templateBook(quarter)?.versions.find(v => v.id === templateBook(quarter).activeId);
  const versionLabel = version => `方案 V${version.number} · ${version.name}`;

  function ensureTemplateDraft(quarter, base) {
    const key = templateScope(quarter);
    const context = { marketing: state.marketing, subsidyPct: state.presentation ? state.demo.subsidyPct : null, datasetVersion: dataset.version };
    const existing = state.templateDrafts[key];
    if (existing && (existing.inheritLegacy === true || JSON.stringify(existing.context) !== JSON.stringify(context))) {
      const rows = buildOfferTemplateRows(dataset.records, { ...assumptions(), quarter, marketingRate: state.marketing, legacy: offerPlans() });
      const previous = new Map(existing.rows.map(row => [row.key, row]));
      if (existing.inheritLegacy !== true) rows.forEach(row => { if (previous.has(row.key)) row.ratios = [...previous.get(row.key).ratios]; });
      existing.rows = rows; existing.context = context;
    }
    if (!state.templateDrafts[key]) {
      const rows = buildOfferTemplateRows(dataset.records, { ...assumptions(), quarter, marketingRate: state.marketing, legacy: offerPlans() });
      if (base) {
        const prior = new Map(base.rows.map(row => [row.key, row]));
        rows.forEach(row => { if (prior.has(row.key)) row.ratios = [...prior.get(row.key).ratios]; });
      }
      state.templateDrafts[key] = { quarter, presentation: state.presentation, name: `方案 ${templateBook(quarter)?.nextNumber ?? 1}`, rows, parentId: base?.id ?? null, inheritLegacy: !base,
        context };
    }
    return state.templateDrafts[key];
  }

  function templateViewData(quarter) {
    const key = templateScope(quarter), book = templateBook(quarter);
    if (!book?.versions.length) ensureTemplateDraft(quarter);
    const id = state.templateUI.views[key] ?? book?.activeId ?? book?.versions[0]?.id ?? 'draft';
    const isDraft = id === 'draft';
    const view = isDraft ? ensureTemplateDraft(quarter, activeTemplate(quarter)) : book?.versions.find(v => v.id === id) ?? book?.versions[0];
    return { quarter, book, view, isDraft, draft: state.templateDrafts[key], filters: selection(),
      compare: book?.versions.find(v => v.id === state.templateUI.compares[key]), onlyChanges: state.templateUI.changes[key], error: state.templateUI.errors[key] };
  }

  function templatesView() {
    return dataset.quarters.filter(q => state.quarter === 'all' || q.quarter === state.quarter).map(q => renderOfferTemplate(templateViewData(q.quarter))).join('');
  }

  function effectiveTemplateAllocation(rows) {
    const quarters = dataset.quarters.filter(q => state.quarter === 'all' || q.quarter === state.quarter).map(q => q.quarter);
    if (!quarters.some(activeTemplate)) return { active: false };
    const result = Object.fromEntries(REAL_OFFERS.map(name => [name, 0]));
    let complete = true;
    for (const quarter of quarters) {
      const scopedRows = rows.filter(r => r.quarter === quarter), version = activeTemplate(quarter);
      const key = [quarter, state.month === 'all' ? 'all' : `${state.month}@544`, state.disti, state.t2, state.lob, state.subLob].join('|');
      const allocation = version ? allocateTemplateOffers(scopedRows, version, state.marketing, assumptions()) : offerPlans()[key] ?? (state.presentation ? summary(scopedRows).offers : null);
      if (!allocation) complete = false;
      else REAL_OFFERS.forEach(name => { result[name] += allocation[name]; });
    }
    return { active: true, allocation: complete ? result : null, label: quarters.map(q => activeTemplate(q) ? `${q} ${versionLabel(activeTemplate(q))}` : `${q} 原计划`).join(' / ') };
  }

  function goToTemplate(quarter = state.quarter, edit = false) {
    if (quarter === 'all' && edit) {
      const activeQuarters = dataset.quarters.filter(q => activeTemplate(q.quarter));
      if (activeQuarters.length === 1) quarter = activeQuarters[0].quarter;
    }
    state.quarter = quarter; state.tab = 'allocation';
    if (edit && quarter !== 'all') { ensureTemplateDraft(quarter, activeTemplate(quarter)); state.templateUI.views[templateScope(quarter)] = 'draft'; }
    render();
    const section = root.querySelector('#real-offer-plans');
    section?.focus({ preventScroll: true }); section?.scrollIntoView({ block: 'start' });
  }

  function handleTemplateAction(button) {
    const quarter = button.dataset.quarter, key = templateScope(quarter), action = button.dataset.templateAction;
    const data = templateViewData(quarter), book = templateBook(quarter);
    if (action === 'view') state.templateUI.views[key] = button.dataset.versionId;
    if (action === 'new') { ensureTemplateDraft(quarter, data.view); state.templateUI.views[key] = 'draft'; }
    if (action === 'discard') { delete state.templateDrafts[key]; state.templateUI.views[key] = book?.activeId ?? book?.versions[0]?.id; save(); }
    if (['save', 'apply', 'disable'].includes(action)) {
      const old = JSON.stringify({ book, draft: state.templateDrafts[key] });
      try {
        if (action === 'save') {
          const draft = state.templateDrafts[key];
          const next = saveOfferVersion(book, draft, { name: draft.name });
          state.offerTemplates[templateMode()][quarter] = next;
          state.templateUI.compares[key] = next.versions.some(v => v.id === book?.activeId) ? book.activeId : next.versions[1]?.id ?? '';
          state.templateUI.views[key] = next.activeId; delete state.templateDrafts[key];
        } else state.offerTemplates[templateMode()][quarter] = { ...book, activeId: action === 'apply' ? data.view.id : null };
        if (!save()) throw new Error('浏览器存储失败，未保存本次版本。请导出草稿后检查可用空间。');
        delete state.templateUI.errors[key];
        state.notice = action === 'disable' ? '已停用方案，恢复原手工计划；历史版本仍保留' : action === 'save' ? '新版本已保存并应用；历史版本保持不变' : '已应用所选版本的比例，历史金额快照不变';
      } catch (error) {
        const restored = JSON.parse(old);
        if (restored.book) state.offerTemplates[templateMode()][quarter] = restored.book; else delete state.offerTemplates[templateMode()][quarter];
        if (restored.draft) state.templateDrafts[key] = restored.draft;
        state.templateUI.views[key] = restored.draft ? 'draft' : restored.book?.activeId;
        state.templateUI.errors[key] = error.message;
      }
    }
    render();
  }

  function updateTemplateCell(element) {
    const quarter = element.dataset.quarter, draft = state.templateDrafts[templateScope(quarter)];
    const row = draft?.rows.find(r => r.key === element.dataset.templateCell); if (!row) return;
    draft.inheritLegacy = false;
    const index = Number(element.dataset.offerIndex);
    row.ratios[index] = element.value === '' ? null : Number(element.value);
    const tr = element.closest('tr'), valid = validateOfferTemplate(draft.rows), cellValid = validateOfferTemplate([row]);
    const total = tr.querySelector('[data-template-row-total]');
    total.textContent = `${row.ratios.every(Number.isFinite) ? Number(row.ratios.reduce((sum, value) => sum + value, 0).toFixed(4)) : '—'}%`;
    total.className = cellValid.valid ? 'real-valid' : 'real-pending';
    tr.querySelector(`[data-template-amount="${index}"]`).textContent = row.ratios[index] == null ? '—' : realMoney(row.budget * row.ratios[index] / 100);
    const panel = element.closest('[data-template-quarter]');
    panel.querySelector('[data-template-action="save"]').disabled = !valid.valid;
    const status = panel.querySelector('[data-template-validation]');
    status.textContent = valid.valid ? '所有行合计 100%，可保存' : `${valid.invalid.length} 行比例待调整（含筛选外行）`;
    status.className = valid.valid ? 'real-valid' : 'real-pending';
    const comparison = templateViewData(quarter).compare;
    const changes = compareOfferVersions(draft, comparison).filter(r => templateRowMatches(r, selection()));
    const changedRow = changes.find(r => r.key === row.key);
    if (comparison && changedRow) {
      const label = tr.querySelector(`[data-template-amount="${index}"]`).parentElement.querySelector('.template-cell-delta');
      label.textContent = templateDelta(changedRow.ratioDelta[index], 'pp');
      label.classList.toggle('has-change', Math.abs(changedRow.ratioDelta[index] ?? 0) > .00001);
      label.nextElementSibling.textContent = templateDelta(changedRow.amountDelta[index]);
      tr.classList.toggle('is-changed', changedRow.changed);
    }
    panel.querySelectorAll('.template-total-table tbody tr').forEach((tr, i) => {
      const current = changes.reduce((sum, r) => sum + (r.current && Number.isFinite(r.current.ratios[i]) ? r.current.budget * r.current.ratios[i] / 100 : 0), 0);
      const previous = changes.reduce((sum, r) => sum + (r.baseline ? r.baseline.budget * r.baseline.ratios[i] / 100 : 0), 0);
      const cells = tr.querySelectorAll('td'); cells[0].textContent = realMoney(current); cells[2].textContent = comparison ? templateDelta(current - previous) : '—';
    });
    if (!save()) { status.textContent = '草稿暂未保存到浏览器，请导出备份'; status.className = 'real-pending'; }
  }

  function exportTemplates() {
    const records = [['季度', '查看版本', '对比版本', 'ND', 'LOB', 'Sub', 'Offer', 'Offer%', '预算金额', 'Offer金额', '对比Offer%', '比例差pp', '对比Offer金额', '金额差', '数据模式', '保存时间']];
    for (const { quarter } of dataset.quarters.filter(q => state.quarter === 'all' || q.quarter === state.quarter)) {
      const d = templateViewData(quarter);
      for (const row of compareOfferVersions(d.view, d.compare).filter(r => templateRowMatches(r, selection()))) {
        REAL_OFFERS.forEach((name, i) => records.push([quarter, d.isDraft ? '未保存草稿' : versionLabel(d.view), d.compare ? versionLabel(d.compare) : '', row.nd, row.lob, row.sub, name,
          row.current?.ratios[i], row.current?.budget, row.current && Number.isFinite(row.current.ratios[i]) ? row.current.budget * row.current.ratios[i] / 100 : null,
          row.baseline?.ratios[i], row.ratioDelta[i], row.baseline ? row.baseline.budget * row.baseline.ratios[i] / 100 : null, row.amountDelta[i], state.presentation ? '情景模拟' : '基础计划', d.view.createdAt ?? '未保存']));
      }
    }
    const csv = '\uFEFF' + records.map(row => row.map(value => `"${String(value ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const link = doc.createElement('a'); link.href = url; link.download = `Offer_Plan_${state.quarter}_${state.presentation ? '情景模拟' : '基础计划'}.csv`; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function dataModeBar() {
    return `<section class="real-data-mode ${state.presentation ? 'real-data-mode--demo' : ''}"><div class="real-mode-heading"><div><strong>${state.presentation ? '情景模拟 · 全部使用合成数据' : '基础示例 · 实际值待录入'}</strong><p>预算单价：最低到手价优先，缺失时用 ALP。${state.presentation ? '预测、价格、贡献率、执行额和 Offer 分配均为独立构造的合成示例。' : '仅展示合成基础记录与预算计算；实际执行值保留缺失。'}</p></div><div class="real-mode-switch" aria-label="数据模式"><button data-data-mode="real" aria-pressed="${!state.presentation}">基础示例</button><button data-data-mode="demo" aria-pressed="${state.presentation}">情景模拟</button></div></div>${state.presentation ? `<details class="real-demo-settings" ${state.demoSettingsOpen ? 'open' : ''}><summary>调整演示参数</summary><div><label>补贴占预算测算流水<input type="number" data-demo-param="subsidyPct" min="0" max="3" step="0.1" value="${state.demo.subsidyPct}" aria-label="演示补贴比例"><span>%</span></label><label>执行率基准<input type="number" data-demo-param="executionPct" min="50" max="110" step="1" value="${state.demo.executionPct}" aria-label="演示执行率基准"><span>%</span></label><small>执行率按 T2／LOB 固定浮动 −15～+19 个百分点；Offer 随品类结构分配。参数和分配仅保存在本机。</small></div></details>` : ''}</section>`;
  }

  function interactionBar() {
    const chips = [
      ['disti', '总代', state.disti], ['t2', 'T2', state.t2 === 'all' ? 'all' : allT2s.find(t => t.id === state.t2)?.name],
      ['lob', 'LOB', state.lob], ['subLob', 'Sub LOB', state.subLob],
      ['month', '月度', state.month === 'all' ? 'all' : monthLabels[Number(state.month) - 1]],
      ['search', '搜索', state.search], ['showUnpriced', '', state.showUnpriced ? '仅看待补价格' : ''],
    ].filter(([key, , value]) => value && value !== 'all' && (state.tab === 'details' || !['search', 'showUnpriced'].includes(key)));
    return `<div class="real-interaction-bar"><div class="real-filter-chips" aria-label="当前筛选"><span>${quarterLabel()}</span>${chips.map(([key, label, value]) => `<button data-clear-filter="${key}" aria-label="清除${label || value}筛选">${label ? `${label}：` : ''}${realEscape(value)} <span aria-hidden="true">×</span></button>`).join('')}${!chips.length ? '<small>全部范围</small>' : ''}</div><div class="real-inline-actions">${state.trail.length ? '<button data-action="back">← 返回上一层</button>' : ''}${state.tab !== 'progress' ? '<button data-action="view-progress">SO / Offer 进度 →</button>' : ''}${state.tab !== 'details' ? '<button data-action="view-details">查看当前明细 →</button>' : ''}<button data-action="undo-edit" ${edits.latest ? '' : 'disabled'} title="${edits.latest ? `撤销：${realEscape(edits.latest)}` : '本次打开尚无修改'}">撤销上次修改</button></div>${state.notice ? `<p role="status" class="real-edit-notice">${realEscape(state.notice)}</p>` : ''}</div>`;
  }

  function rememberDialogFocus() {
    const active = doc.activeElement;
    const attribute = ['data-record', 'data-offer-item', 'data-action'].find(name => active?.hasAttribute(name));
    dialogReturnSelector = attribute ? `[${attribute}="${CSS.escape(active.getAttribute(attribute))}"]` : '[data-tab][aria-selected="true"]';
  }
  function closeDialog(renderPage = false) {
    if (state.dialog?.returnPeriod) { Object.assign(state, state.dialog.returnPeriod); renderPage = true; }
    state.dialog = null;
    if (renderPage) render(); else renderDialog();
    root.querySelector(dialogReturnSelector)?.focus();
  }

  function kpis(rows) {
    const s = summary(rows);
    return `<section class="role-kpi-grid real-kpis ${state.presentation ? 'real-kpis--demo' : ''}">${[
      ["SO 预测", realCount(s.soUnits), "保留源表预测小数"],
      ["预算测算流水", realMoney(s.gmv), s.missingRows ? `已匹配 ${realPct(s.coverage)} 的 SO` : "SO × 最低到手价（缺失用 ALP）"],
      ["资金池测算", realMoney(s.budget), state.presentation ? "含示例平台补贴" : "已计价部分 · 不含待录入补贴"],
      ["已执行金额", realMoney(s.actual), state.presentation ? "示例执行 · 非实际报账" : "源文件未提供费用数据"],
      ...(state.presentation ? [["预算执行率", realPct(s.executionRate), `示例结余 ${realMoney(s.budget - s.actual)}`]] : []),
      ["价格覆盖率", realPct(s.coverage), `${realCount(s.unpricedUnits)} SO 待补价格`],
    ].map(([label, value, note]) => `<article class="role-kpi" data-kpi="${label}"><span>${label}</span><strong>${value}</strong><small>${note}</small></article>`).join("")}</section>`;
  }

  function periodToolbar() {
    return `<section class="role-period-rail"><label>期间<select data-filter="quarter" aria-label="季度">${realOption("all", "两个季度合计", state.quarter)}${dataset.quarters.map(q => realOption(q.quarter, q.quarter, state.quarter)).join("")}</select></label><div><span>月度按 5／4／4 周分组</span><div class="role-month-switch">${[["all", "季度汇总"], ...monthLabels.map((label, i) => [String(i + 1), label])].map(([key, name]) => `<button data-month="${key}" aria-pressed="${state.month === key}">${name}</button>`).join("")}</div></div><button class="role-month-edit" data-action="reset">重置筛选</button></section>`;
  }

  function entityFilters() {
    const t2Options = allT2s.filter(t => state.disti === "all" || t.disti === state.disti);
    const subOptions = [...new Set(dataset.records.filter(r => state.lob === "all" || r.lob === state.lob).map(r => r.subLob))].sort();
    return `<div class="real-filter-row">${[
      ["disti", "总代", realOption("all", "全部总代", state.disti) + allDistis.map(name => realOption(name, name, state.disti)).join("")],
      ["t2", "T2", realOption("all", "全部 T2", state.t2) + t2Options.map(t => realOption(t.id, `${t.name} · ${t.id}`, state.t2)).join("")],
      ["lob", "LOB", realOption("all", "全部 LOB", state.lob) + REAL_LOBS.map(lob => realOption(lob, lob, state.lob)).join("")],
      ["subLob", "Sub LOB", realOption("all", "全部 Sub LOB", state.subLob) + subOptions.map(sub => realOption(sub, sub, state.subLob)).join("")],
    ].map(([key, name, options]) => `<label>${name}<select data-filter="${key}" aria-label="${name}">${options}</select></label>`).join("")}</div>`;
  }

  function sourceCards(rows) {
    const s = summary(rows);
    const entry = (label, value) => `<div class="source-detail-row"><span class="detail-key">${label}</span><span class="detail-val">${value}</span></div>`;
    const cards = [
      ["dealer", "经销商出资", s.dealer, `<div class="source-detail-row dealer-marketing-row"><label for="real-marketing">Marketing 营销</label><div class="dealer-marketing-control"><input id="real-marketing" type="range" min="0" max="1" step="0.1" value="${state.marketing}" aria-label="Marketing 贡献率"><output>${state.marketing.toFixed(1)}%</output></div></div>${entry("固定成本（参考，不计入贡献率）", "5.5%")}${REAL_FIXED_COSTS.map(([label, value]) => entry(label, `${value.toFixed(1)}%`)).join("")}${entry("经销商贡献率", `${state.marketing.toFixed(1)}%`)}${entry("计算公式", "Marketing × SO 预测 × 预算单价")}`],
      ["mdf", "品牌 MDF", s.mdf, REAL_LOBS.map(lob => entry(`${lob} 贡献率`, `${(MDF_RATES[lob] * 100).toFixed(2)}%`)).join("") + entry("参数口径", "虚构直接贡献率") + entry("测算基数", "SO 预测 × 预算单价")],
      ["subsidy", "平台补贴", s.subsidy, (state.presentation ? entry("示例补贴比例", `${state.demo.subsidyPct.toFixed(1)}% × 预算测算流水`) : '') + ["联合活动补贴", "以旧换新对投", "免息分期贴息", "会员优惠 券补贴", "积分／积分抵扣", "其他补贴 ……"].map((name, i) => entry(name, s.subsidy == null ? "待录入" : realMoney(s.subsidy * [.3, .2, .2, .12, .1, .08][i]))).join("")],
      ["reward", "平台奖励", s.reward, entry("平台佣金返点", "0.5%") + entry("测算基数", "SO 预测 × 预算单价")],
    ];
    return `<section class="budget-engine-card real-source-container"><div class="real-section-heading"><div><h2>四方资金构成</h2><p>经销商出资 + 品牌 MDF + 平台补贴 + 平台奖励</p></div><span>${periodLabel()} · ${realEscape(scopeName())}</span></div><div class="funding-sources-grid funding-sources-4col">${cards.map(([key, title, amount, content], index) => `<article class="source-card source-card-${key}"><div class="real-source-head"><span>资金来源 ${index + 1}</span><strong class="source-amount">${realMoney(amount)}</strong></div><h3 class="source-name">${title}</h3><div class="real-source-progress"><i style="width:${s.budget ? (amount ?? 0) / s.budget * 100 : 0}%;background:${realColors[index]}"></i></div><div class="source-details-box">${content}</div></article>`).join("")}</div></section>`;
  }

  function sourcePortfolio(rows) {
    const s = summary(rows);
    const sources = [["dealer", "经销商出资", s.dealer], ["mdf", "品牌 MDF", s.mdf], ["subsidy", "平台补贴", s.subsidy], ["reward", "平台奖励", s.reward]];
    let cursor = 0;
    const stops = sources.filter(([, , value]) => value != null).map(([key, , value]) => {
      const start = cursor; cursor += s.budget ? value / s.budget * 100 : 0;
      return `${realColors[sources.findIndex(item => item[0] === key)]} ${start}% ${cursor}%`;
    }).join(",");
    return realCard("资金来源构成", `<div class="role-source-layout"><div class="role-source-ring" style="background:${s.budget ? `conic-gradient(${stops})` : "#eee"}"><div><span>资金池测算</span><strong>${realMoney(s.budget)}</strong></div></div><ol>${sources.map(([key, name, value], i) => `<li tabindex="0" role="button" data-source="${key}" aria-pressed="${state.source === key}"><i style="background:${realColors[i]}"></i><span>${name}</span><strong>${value == null ? "待录入" : realPct(s.budget ? value / s.budget : null)}</strong><small>${realMoney(value)}</small></li>`).join("")}</ol></div><p class="real-note">${state.presentation ? '资金池占比 · 平台补贴为示例，其余按虚构贡献率测算。' : '占比以已知测算资金为分母；平台补贴待录入。'}</p>`, "role-source-portfolio", realEscape(scopeName()));
  }

  function childKey() { return state.t2 !== "all" ? "lob" : state.disti !== "all" ? "t2Id" : "disti"; }
  function adjustedGroups(rows, key) {
    const base = groups(rows, key);
    const allocation = allocationPlans()[`${scopeKey()}|${key}`];
    if (!allocation) return base;
    return base.map(item => { const budget = allocation[item.key] ?? item.summary.budget; return { ...item, summary: { ...item.summary, budget, executionRate: item.summary.actual != null && budget > 0 ? item.summary.actual / budget : null } }; });
  }
  function comparison(rows, key = childKey()) {
    const items = adjustedGroups(rows, key);
    const total = summary(rows).budget;
    const title = key === "disti" ? "总代执行对比" : key === "t2Id" ? "T2 执行对比" : "LOB 预算与执行";
    const action = key === "disti" ? "disti" : key === "t2Id" ? "t2" : "lob";
    const width = amount => total > 0 ? Math.max(0, Math.min(100, amount / total * 100)) : 0;
    return realCard(title, `${budgetPlanNote(rows, key)}<div class="role-chart-legend"><span><i class="role-legend-budget"></i>测算预算</span><span>${state.presentation ? '<i class="role-legend-actual"></i>已执行金额' : '执行待录入'}</span></div><div class="role-comparison-total">当前总预算 ${realMoney(total)} = 100%</div><div class="role-bars role-bars--shared-scale">${items.map((item, index) => `<div class="role-bar-row real-comparison-row" role="button" tabindex="0" data-drill="${action}" data-value="${realEscape(item.key)}"><strong><span>${realEscape(item.label)}</span><em class="role-budget-share">占总预算 ${realPct(total ? item.summary.budget / total : null)}</em></strong><div class="role-bar-track">${index === 0 ? '<span class="role-comparison-scale"><span>0%</span><span>50%</span></span>' : ""}<i class="role-comparison-midline"></i><i class="role-bar role-bar--budget" style="width:${width(item.summary.budget)}%"></i></div><span>预算 ${realMoney(item.summary.budget)}</span><div class="role-bar-track ${state.presentation ? '' : 'real-missing-track'}">${state.presentation ? `<i class="role-bar role-bar--actual" style="width:${width(item.summary.actual)}%"></i>` : ''}</div><span>${state.presentation ? `执行 ${realMoney(item.summary.actual)}` : '执行待录入 · 执行率 —'}</span><small class="role-bar-rate">${state.presentation ? `执行率 <b>${realPct(item.summary.executionRate)}</b> · ${item.summary.budget >= item.summary.actual ? '剩余预算' : '超出预算'} ${realMoney(Math.abs(item.summary.budget - item.summary.actual))}` : `SO ${realCount(item.summary.soUnits)} · 预算测算流水 ${realMoney(item.summary.gmv)}`}</small></div>`).join("") || '<p class="role-empty">当前筛选无记录</p>'}</div>`, "role-chart-card--wide real-execution", state.presentation ? '补贴与执行为示例 · 灰色全长代表总预算' : '');
  }

  function budgetPlanNote(rows, key) {
    const plan = allocationPlans()[`${scopeKey()}|${key}`];
    if (!plan) return '';
    const values = groups(rows, key).map(item => plan[item.key]);
    const validation = validateRealAllocation(values, Math.round(summary(rows).budget));
    return validation.valid ? '' : `<p class="real-pending real-plan-warning">预算已变化，请复核已保存分配。当前分配合计 ${realMoney(validation.total)}；${validation.difference >= 0 ? '待分配' : '超出'} ${realMoney(Math.abs(validation.difference))}。执行率暂按保留的分配计算。</p>`;
  }

  function flow(rows) {
    const lobs = groups(rows, "lob");
    const s = summary(rows);
    const sources = [["dealer", "经销商出资"], ["mdf", "品牌 MDF"], ["subsidy", "平台补贴"], ["reward", "平台奖励"]].filter(([key]) => !state.source || state.source === key);
    return realCard("资金流向", `<div class="role-table-wrap"><table class="role-data-table real-flow-table"><thead><tr><th>资金来源</th>${REAL_LOBS.map(lob => `<th>${lob}</th>`).join("")}<th>来源合计</th></tr></thead><tbody>${sources.map(([key, name]) => `<tr><th>${name}</th>${REAL_LOBS.map(lob => { const item = lobs.find(g => g.key === lob); const value = key === "subsidy" && !state.presentation ? null : item?.summary[key] ?? 0; return `<td><div style="background:${realColors[["dealer", "mdf", "subsidy", "reward"].indexOf(key)]}14"><strong>${realMoney(value)}</strong><small>${value == null ? "待录入" : `占 ${lob} ${realPct(item?.summary.budget ? value / item.summary.budget : null)}`}</small></div></td>`; }).join("")}<td><strong>${realMoney(s[key])}</strong></td></tr>`).join("")}</tbody></table></div>`, "role-chart-card--wide", `按 ${periodLabel()}  · ${state.presentation ? "补贴为示例" : "已知资金测算"}`);
  }

  function matrix(rows, overview = false) {
    const items = groups(rows, "lob");
    const title = overview ? "品类预算构成矩阵（LOB）" : "LOB 健康度矩阵";
    return realCard(title, `<div class="role-table-wrap"><table class="role-data-table"><thead><tr><th>LOB</th><th>SO 预测</th><th>预算测算流水</th>${overview ? "<th>经销商出资</th><th>经销商贡献率</th><th>MDF 后返</th><th>MDF 贡献率</th><th>平台奖励</th><th>平台补贴</th>" : ""}<th>测算预算</th><th>已执行金额</th><th>执行率</th></tr></thead><tbody>${items.map(item => `<tr role="button" tabindex="0" data-drill="lob" data-value="${item.key}"><th>${item.key}</th><td>${realCount(item.summary.soUnits)}</td><td>${realMoney(item.summary.gmv)}</td>${overview ? `<td>${realMoney(item.summary.dealer)}</td><td>${state.marketing.toFixed(1)}%</td><td>${realMoney(item.summary.mdf)}</td><td>${(MDF_RATES[item.key] * 100).toFixed(2)}%</td><td>${realMoney(item.summary.reward)}</td><td>${realMoney(item.summary.subsidy)}</td>` : ""}<td>${realMoney(item.summary.budget)}</td><td>${realMoney(item.summary.actual)}</td><td>${realPct(item.summary.executionRate)}</td></tr>`).join("")}</tbody></table></div>`, "role-chart-card--wide", state.presentation ? "补贴与执行为示例" : "未录入已执行金额前不计算执行风险");
  }

  function weeklyChart(rows) {
    const totals = Array.from({ length: 13 }, (_, i) => rows.reduce((sum, r) => sum + (r.weeks[i] || 0), 0));
    const maximum = Math.max(...totals, 1);
    return realCard("周度 SO 预测", `<div class="real-week-chart">${totals.map((value, i) => `<div title="W${i + 1}：${realCount(value)}"><span>${realCount(value)}</span><div><i style="height:${Math.max(0, value / maximum * 100)}%;opacity:${state.month === "all" || FINANCIAL_MONTHS[Number(state.month) - 1]?.[0] <= i && i < FINANCIAL_MONTHS[Number(state.month) - 1]?.[1] ? 1 : 0.25}"></i></div><small>W${i + 1}</small></div>`).join("")}</div>`, "role-chart-card--wide", "原表13周 · 数量");
  }

  function offerCard(rows) {
    const s = summary(rows);
    const template = effectiveTemplateAllocation(rows);
    const saved = offerPlans()[scopeKey()];
    const allocation = template.active ? template.allocation : saved ?? (state.presentation ? s.offers : null);
    const total = allocation ? REAL_OFFERS.reduce((sum, name) => sum + allocation[name], 0) : null;
    const stale = !template.active && saved && !validateRealAllocation(REAL_OFFERS.map(name => allocation[name]), Math.round(s.budget)).valid;
    const showActual = state.presentation && state.offerMetric === 'actual';
    const actualBasisTotal = saved ? REAL_OFFERS.reduce((sum, name) => sum + saved[name], 0) : 0;
    const displayed = showActual ? (saved ? Object.fromEntries(REAL_OFFERS.map(name => [name, actualBasisTotal > 0 ? s.actual * saved[name] / actualBasisTotal : 0])) : s.offerActuals) : allocation;
    const displayedTotal = displayed ? Object.values(displayed).reduce((sum, value) => sum + value, 0) : null;
    let cursor = 0;
    const stops = displayed ? REAL_OFFERS.map((name, i) => { const start = cursor; cursor += displayedTotal > 0 ? displayed[name] / displayedTotal * 100 : 0; return `${realColors[i]} ${start}% ${cursor}%`; }).join(',') : '';
    const ring = state.presentation ? `<div class="role-source-ring real-offer-ring" style="background:${displayedTotal > 0 ? `conic-gradient(${stops})` : '#eee'}"><div><span>${showActual ? '已执行金额' : 'Offer 预算'}</span><strong>${realMoney(displayedTotal)}</strong><small>示例分配</small></div></div>` : '';
    const content = allocation ? `<div class="${state.presentation ? 'real-offer-layout' : ''}">${ring}<div class="real-offer-list">${REAL_OFFERS.map((name, i) => `<div><i style="background:${realColors[i]}"></i><span>${name}</span><strong>${realMoney(displayed[name])}</strong><small>${realPct(displayedTotal ? displayed[name] / displayedTotal : null)}</small><b style="width:${displayedTotal > 0 ? Math.max(0, displayed[name] / displayedTotal * 100) : 0}%;background:${realColors[i]}"></b></div>`).join("")}</div></div>` : `<div class="real-offer-empty"><strong>待分配</strong><p>当前数据未包含 Offer 预算</p><div>${REAL_OFFERS.map(name => `<span>${name}</span>`).join("")}</div></div>`;
    const metric = state.presentation ? `<div class="real-mode-switch real-offer-metric">${[['budget', '预算'], ['actual', '已执行']].map(([key, label]) => `<button data-offer-metric="${key}" aria-pressed="${state.offerMetric === key}">${label}</button>`).join('')}</div>` : '';
    return realCard("Offer 构成", `${template.active ? `<p class="real-note">${realEscape(template.label)} · 比例按当前预算计算</p>` : ""}${metric}${content}${stale ? '<p class="real-pending">预算已变化，请复核已录入的 Offer 分配。</p>' : ""}<div class="real-card-actions"><span>${state.presentation ? `${saved ? '已调整示例计划' : '按 LOB 自动生成示例'} · ${showActual ? '示例执行合计' : '预算合计'} ${realMoney(displayedTotal)}` : allocation ? `已录入计划 ${realMoney(total)}` : `可分配测算预算 ${realMoney(s.budget)}`}</span><div class="real-inline-actions"><button data-action="offer-template">方案与版本</button><button class="real-primary" data-action="offer-edit">${allocation ? "编辑分配" : "录入分配"}</button></div></div>`, "role-offer-card real-offer-wide", state.presentation ? '点击类别调整资金／比例 · 示例数据' : '');
  }

  function dataIssues(rows) {
    const missing = rows.filter(r => r.alp == null);
    const negative = rows.filter(r => r.soUnits < 0);
    const fallback = rows.filter(r => r.budgetPriceBasis === 'ALP 替代');
    return realCard("数据状态", `<div class="real-issues"><p><strong>已执行金额、平台补贴</strong><span>${state.presentation ? '已补充示例 · 非实际报账' : '待录入'}</span></p><p><strong>Offer 预算</strong><span>${effectiveTemplateAllocation(rows).active ? realEscape(effectiveTemplateAllocation(rows).label) : state.presentation ? offerPlans()[scopeKey()] ? '已调整示例计划' : '已生成示例分配' : offerPlans()[scopeKey()] ? '已录入计划' : '待录入'}</span></p><p><strong>预算单价口径</strong><span>最低到手价优先；${new Set(fallback.map(r => r.mpn)).size} 个 MPN 使用 ALP 替代</span></p><p><strong>最低到手价与 ALP 均待确认</strong><span>${new Set(missing.map(r => r.mpn)).size} 个 MPN · SO ${realCount(missing.reduce((sum, r) => sum + r.periodUnits, 0))}</span></p>${negative.length ? `<p><strong>源表负数调整</strong><span>${negative.map(r => `${realEscape(r.mpn)}：${r.soUnits}`).join("；")}</span></p>` : ""}<button data-action="unpriced">查看待补价格明细</button></div>`, "role-chart-card--wide", state.presentation ? '全部记录与参数均为合成示例' : '缺失项不按零费用处理');
  }

  function efficiency(rows) {
    const key = childKey();
    const items = adjustedGroups(rows, key);
    return realCard(key === "disti" ? "总代经营效率" : "T2 经营效率", `${budgetPlanNote(rows, key)}<div class="role-table-wrap"><table class="role-data-table"><thead><tr><th>${key === "disti" ? "总代" : "T2"}</th><th>SO 预测</th><th>已匹配预算测算流水</th><th>测算预算</th><th>已执行金额</th><th>执行率</th></tr></thead><tbody>${items.map(item => `<tr><th>${realEscape(item.label)}</th><td>${realCount(item.summary.soUnits)}</td><td>${realMoney(item.summary.gmv)}</td><td>${realMoney(item.summary.budget)}</td><td>${realMoney(item.summary.actual)}</td><td>${realPct(item.summary.executionRate)}</td></tr>`).join("")}</tbody></table></div>`, "role-chart-card--wide", state.presentation ? "预算含示例补贴 · 执行为示例" : "");
  }

  function subLobs(rows) {
    const lobs = groups(rows, "lob");
    return realCard("Sub LOB 预算与执行", lobs.map(lob => `<article class="role-sub-lob-group"><button class="role-sub-lob-toggle" data-expand="${lob.key}" aria-expanded="${state.expandedLob === lob.key}"><span class="role-sub-lob-name"><strong>${lob.key}</strong><small>${new Set(lob.records.map(r => r.subLob)).size} 个 Sub LOB</small></span><span class="role-sub-lob-summary"><span><small>测算预算</small><strong>${realMoney(lob.summary.budget)}</strong></span><span><small>SO预测</small><strong>${realCount(lob.summary.soUnits)}</strong></span><span><small>已执行金额</small><strong>${realMoney(lob.summary.actual)}</strong></span></span><i class="role-sub-lob-chevron"></i></button>${state.expandedLob === lob.key ? `<div class="role-sub-lob-panel"><table class="role-data-table"><thead><tr><th>Sub LOB</th><th>SO预测</th><th>测算预算</th><th>已执行金额</th></tr></thead><tbody>${groups(lob.records, "subLob").map(sub => `<tr tabindex="0" role="button" data-drill="subLob" data-value="${realEscape(sub.key)}"><th>${realEscape(sub.key)}</th><td>${realCount(sub.summary.soUnits)}</td><td>${realMoney(sub.summary.budget)}</td><td>${realMoney(sub.summary.actual)}</td></tr>`).join("")}</tbody></table></div>` : ""}</article>`).join(""), "role-chart-card--wide", state.presentation ? "按 LOB 展开查看明细 · 补贴与执行为示例" : "按 LOB 展开查看明细");
  }

  function roleToolbar() {
    return `<section class="role-toolbar"><div><span class="role-view-label">角色视角</span><div class="role-choice">${[["manager", "Manager"], ["disti", "总代"], ["t2", "T2"]].map(([key, name]) => `<button data-role="${key}" aria-pressed="${state.role === key}">${name}</button>`).join('')}</div></div><div class="role-toolbar-context"><p>${realEscape(scopeName())}</p></div></section>`;
  }

  function progressData() {
    return dataset.quarters.filter(q => state.quarter === 'all' || q.quarter === state.quarter).map(({ quarter }) => {
      const rows = selectRealRecords(dataset.records, { ...selection(), quarter, month: 'all', includeActuals: true });
      const key = [quarter, 'all', state.disti, state.t2, state.lob, state.subLob].join('|');
      const version = activeTemplate(quarter);
      return buildQuarterProgress(rows, { ...assumptions(), quarter, cutoffWeek: state.progressWeeks[quarter], marketingRate: state.marketing, offerAllocation: offerPlans()[key],
        ...(version ? { offerWeeklyPlan: Array.from({ length: 13 }, (_, i) => allocateTemplateOffers(rows.map(r => ({ ...r, periodUnits: r.weeks[i] })), version, state.marketing, assumptions())), offerPlanLabel: versionLabel(version) } : { offerAllocation: offerPlans()[key] }) });
    });
  }

  function progressView() {
    return roleToolbar() + progressData().map(progress => renderProgressQuarter(progress, { month: state.month, selectedOffer: state.progressOffers[progress.quarter], scopeName: scopeName() })).join('');
  }

  function roleView(rows) {
    const label = { manager: "Manager", disti: "总代", t2: "T2" }[state.role];
    const intro = `<section class="real-page-heading"><div><h2>经营总览</h2><p>${label} · ${realEscape(scopeName())} · ${periodLabel()}</p></div><button class="real-text-button" data-action="view-planning">调整资金规划 →</button></section>`;
    const cards = state.role === "t2"
      ? `<div class="role-chart-grid role-chart-grid--t2">${offerCard(rows)}${comparison(rows, "lob")}${subLobs(rows)}${weeklyChart(selectRealRecords(dataset.records, { ...selection(), month: "all" }))}${dataIssues(rows)}</div>`
      : `<div class="role-chart-grid real-management-grid">${sourcePortfolio(rows)}${comparison(rows)}${offerCard(rows)}${flow(rows)}${matrix(rows)}${efficiency(rows)}${dataIssues(rows)}</div>`;
    return `${roleToolbar()}${intro}${kpis(rows)}${cards}`;
  }

  function detailView(rows) {
    const filtered = detailRows(rows);
    const pages = Math.max(1, Math.ceil(filtered.length / 40));
    state.page = Math.min(state.page, pages - 1);
    const visible = filtered.slice(state.page * 40, (state.page + 1) * 40);
    const sortable = (key, label) => `<th aria-sort="${state.sortKey === key ? state.sortDirection === 'asc' ? 'ascending' : 'descending' : 'none'}"><button class="real-sort-button" data-sort="${key}" title="点击切换排序">${label}<i aria-hidden="true">${state.sortKey === key ? state.sortDirection === 'asc' ? '↑' : '↓' : '↕'}</i></button></th>`;
    return `<div class="real-detail-tools"><label>查找产品或 T2<input type="search" data-search value="${realEscape(state.search)}" placeholder="MPN、型号、T2名称"></label><label class="real-check"><input type="checkbox" data-unpriced ${state.showUnpriced ? "checked" : ""}>仅看待补价格</label><span>${filtered.length} 条记录</span></div>${realCard("SO 与产品价格明细", `
      <div class="role-table-wrap"><table class="role-data-table real-detail-table"><thead><tr><th>季度</th><th>总代 / T2</th><th>LOB / Sub LOB</th>${sortable('mpn', 'MPN / 规格')}${sortable('so', 'SO预测')}${sortable('budgetPrice', '预算单价')}${sortable('gmv', '预算测算流水')}<th>价格口径</th><th>来源</th></tr></thead><tbody>

  function openAllocation(kind, focusItem = '') {
    if (kind === 'offer' && effectiveTemplateAllocation(scoped()).active) { state.notice = '当前使用 ND × Sub 方案。请调整新版本后保存；停用方案可恢复原金额编辑。'; goToTemplate(state.quarter, true); return; }
    rememberDialogFocus();
    const rows = scoped();
    const key = childKey();
    const items = kind === "offer" ? REAL_OFFERS.map(name => ({ key: name, label: name })) : groups(rows, key);
    const target = Math.round(summary(rows).budget);
    const existing = kind === "offer" ? offerPlans()[scopeKey()] : allocationPlans()[`${scopeKey()}|${key}`];
    const generated = kind === 'offer' && state.presentation ? summary(rows).offers : null;
    let assigned = 0;
    const values = items.map((item, index) => {
      if (existing) return existing[item.key] ?? '';
      if (!generated) return '';
      const value = index === items.length - 1 ? Number((target - assigned).toFixed(2)) : Number(generated[item.key].toFixed(2));
      assigned += value; return value;
    });
    state.dialog = { kind, mode: "amount", items, target, key, values, initialValues: [...values], hasSaved: !!existing, scope: scopeKey(), presentation: state.presentation };
    renderDialog();
    const index = items.findIndex(item => item.key === focusItem);
    if (index >= 0) root.querySelector(`[data-allocation-input="${index}"]`)?.focus();
  }

  function renderDialog() {
